[package]
name = "speedwave-runtime"
version = "0.13.2"
edition = "2021"
publish = false
description = "Container runtime abstraction for Speedwave (Lima on macOS, WSL2 on Windows)"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
fs2 = "0.4"
log = { workspace = true }
regex = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.11"
base64 = "0.22"
rand = "0.8.6"
semver = "1"
url = "2"
json-patch = "4"
tokio = { version = "1", default-features = false, features = ["sync"] }
futures-core = "0.3"
async-stream = "0.3"
parking_lot = "0.12"
dashmap = "6"
shlex = "2.0"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
# Used for atomic plugin install staging — `tempdir_in(plugins_dir)`
# guarantees the staging dir lives on the same filesystem as the
# destination, which is the only way `rename(staging, dest)` is atomic.
tempfile = "3"

# --- Optional deps, gated behind the `audio-transcription` feature ---
# (only the Desktop crate enables this feature; the CLI stays lean — see
#  docs/adr/ADR-056-host-side-audio-transcription.md)
hound = { version = "3", optional = true }
# Model downloader (Phase 1b). `blocking` because ModelStore is a synchronous
# API — a large download is a long blocking operation the Tauri layer wraps in
# `spawn_blocking`; `stream` for chunked reads while hashing on the fly.
# `rustls-tls` to match the rest of Speedwave (no system OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "stream"], optional = true }
# Untar the sherpa-onnx diarization-model archives (`.tar.bz2`).
tar = { version = "0.4", optional = true }
bzip2 = { version = "0.6", optional = true }
# Whisper (transcription) — links libwhisper, built from whisper.cpp's vendored
# submodule via cmake at build time (so CI needs `cmake`). The `metal` backend
# is added on macOS only via the target-specific block below; CPU elsewhere.
whisper-rs = { version = "0.16", optional = true }
# Speaker diarization. Exact pin: prebuilt static-lib tarball name encodes the
# version, and Windows CI overrides SHERPA_ONNX_LIB_DIR with the MD-Release
# variant matching this exact version (see ADR-061, .sherpa-onnx-version SSOT).
sherpa-onnx = { version = "=1.13.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# On macOS, build whisper.cpp with the Metal backend (the Metal shader library
# is embedded into the binary — no separate .metallib). Cargo merges this
# feature set with the optional `whisper-rs` entry above.
whisper-rs = { version = "0.16", optional = true, features = ["metal"] }

[target.'cfg(windows)'.dependencies]
# Windows capture (Phase 4-W): WASAPI loopback via cpal. Windows-only — macOS
# uses the bundled audio-capture-cli, so cpal is dead weight there. Still gated
# behind `audio-transcription` so the CLI build stays lean.
cpal = { version = "0.17", optional = true }
# Job Object kill-on-parent-close for host MCP workers
# (`host_mcp_process::job_object`). `Win32_Security` is required to gate
# `CreateJobObjectW` in windows-sys 0.61.x. Same major version as in
# `desktop/src-tauri/Cargo.toml` for workspace coherence.
# SSOT-alignment with desktop/src-tauri/Cargo.toml — version must stay
# in sync across the two workspaces (they have separate Cargo.lock files
# so workspace.dependencies cannot be used). See CLAUDE.md "windows-sys
# version" SSOT-alignment row.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    # JOBOBJECT_EXTENDED_LIMIT_INFORMATION is gated behind
    # Win32_System_Threading in windows-sys 0.61 (compiler hint:
    # "the item is gated behind the `Win32_System_Threading` feature").
    "Win32_System_Threading",
] }

[features]
# Host-side meeting transcription: WAV I/O + the model downloader + the Whisper
# transcriber + the sherpa-onnx diarizer (+ cpal on Windows for WASAPI loopback).
audio-transcription = ["dep:hound", "dep:reqwest", "dep:tar", "dep:bzip2", "dep:whisper-rs", "dep:sherpa-onnx", "windows-capture"]
# Internal: pulls in cpal. Only meaningful on Windows (the target-specific dep
# block above), but listing it unconditionally keeps `--features` simple.
windows-capture = ["dep:cpal"]
# Re-exports `runtime::test_support` with mock builders, so downstream test
# code can construct `LockedRuntime` without seeing the (pub(crate)) trait.
test-support = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
# Local HTTP mock for the model-downloader tests (no real network in unit tests).
mockito = "1"
# Serialises tests that mutate the process-global environment
# (`std::env::set_var`) — without it they race each other and concurrent
# runtime tests.
serial_test = "3"

[lints]
workspace = true

[[test]]
name = "lock_acquisitions"
required-features = ["test-support"]

[[test]]
name = "compose_lock_cross_process"
required-features = ["test-support"]

[[test]]
name = "ssot_enforcement"
# No required-features — pure source-parsing assertions, no runtime types.

[[test]]
name = "apply_transaction_behaviour"
required-features = ["test-support"]
