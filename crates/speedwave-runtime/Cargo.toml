[package]
name = "speedwave-runtime"
version = "0.19.0"
edition = "2021"
publish = false
description = "Container runtime abstraction for Speedwave (Lima on macOS, WSL2 on Windows)"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
fs2 = "0.4"
log = { workspace = true }
regex = "1"
speedwave-pii-engine = { path = "../pii-engine" }
zip = { version = "8", default-features = false, features = ["deflate"] }
ed25519-dalek = "3"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10.2"
semver = "1"
url = "2"
tokio = { version = "1", default-features = false, features = ["sync"] }
parking_lot = "0.12"
dashmap = "6"
shlex = "2.0"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
tempfile = "3"

hound = { version = "3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "stream"], optional = true }
whisper-rs = { version = "0.16", optional = true, features = ["log_backend"] }
num_cpus = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", optional = true, features = ["metal"] }

[target.'cfg(windows)'.dependencies]
cpal = { version = "0.18", optional = true }
wasapi = { version = "0.24", optional = true }
whisper-rs = { version = "0.16", optional = true, features = ["vulkan"] }
ash = { version = "0.38", optional = true, default-features = false, features = ["loaded"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_Globalization",
    "Win32_System_Com",
] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[features]
audio-transcription = ["dep:hound", "dep:num_cpus", "dep:reqwest", "dep:whisper-rs", "windows-capture"]
windows-capture = ["dep:ash", "dep:cpal", "dep:wasapi"]
test-support = []
mcp-os-bundle-e2e = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
mockito = "1"
serial_test = "4"

[lints]
workspace = true

[[test]]
name = "lock_acquisitions"
required-features = ["test-support"]

[[test]]
name = "apt_noninteractive"
required-features = ["test-support"]

[[test]]
name = "compose_lock_cross_process"
required-features = ["test-support"]

[[test]]
name = "build_lock_cross_process"

[[test]]
name = "ssot_enforcement"

[[test]]
name = "apply_transaction_behaviour"
required-features = ["test-support"]
