[package]
name = "speedwave-runtime"
version = "0.10.0"
edition = "2021"
publish = false
description = "Container runtime abstraction for Speedwave (Lima, nerdctl, WSL2)"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
fs2 = "0.4"
log = { workspace = true }
regex = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.11"
base64 = "0.22"
rand = "0.8.6"
semver = "1"
url = "2"
json-patch = "4"
tokio = { version = "1", default-features = false, features = ["sync"] }
futures-core = "0.3"
async-stream = "0.3"
parking_lot = "0.12"
dashmap = "6"
shlex = "1.3"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
# Used for atomic plugin install staging — `tempdir_in(plugins_dir)`
# guarantees the staging dir lives on the same filesystem as the
# destination, which is the only way `rename(staging, dest)` is atomic.
tempfile = "3"

# --- Optional deps, gated behind the `audio-transcription` feature ---
# (only the Desktop crate enables this feature; the CLI stays lean — see
#  docs/adr/ADR-056-host-side-audio-transcription.md)
hound = { version = "3", optional = true }
# Model downloader (Phase 1b). `blocking` because ModelStore is a synchronous
# API — a large download is a long blocking operation the Tauri layer wraps in
# `spawn_blocking`; `stream` for chunked reads while hashing on the fly.
# `rustls-tls` to match the rest of Speedwave (no system OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "stream"], optional = true }
# Untar the sherpa-onnx diarization-model archives (`.tar.bz2`).
tar = { version = "0.4", optional = true }
bzip2 = { version = "0.4", optional = true }
# Whisper (transcription) — links libwhisper, built from whisper.cpp's vendored
# submodule via cmake at build time (so CI needs `cmake`). The `metal` backend
# is added on macOS only via the target-specific block below; CPU elsewhere.
whisper-rs = { version = "0.16", optional = true }
# Speaker diarization — the official sherpa-onnx Rust crate (csukuangfj). Its
# `static` feature (default) downloads a prebuilt static-library archive from
# k2-fsa's GitHub releases at build time (so CI needs network or a vendored
# SHERPA_ONNX_LIB_DIR) and links it in — no shared libs to bundle/sign.
sherpa-onnx = { version = "1.13", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# On macOS, build whisper.cpp with the Metal backend (the Metal shader library
# is embedded into the binary — no separate .metallib). Cargo merges this
# feature set with the optional `whisper-rs` entry above.
whisper-rs = { version = "0.16", optional = true, features = ["metal"] }

[features]
# Host-side meeting transcription: WAV I/O + the model downloader + the Whisper
# transcriber + the sherpa-onnx diarizer. `cpal` is added to this feature in
# Phase 4 (Windows capture).
audio-transcription = ["dep:hound", "dep:reqwest", "dep:tar", "dep:bzip2", "dep:whisper-rs", "dep:sherpa-onnx"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
# Local HTTP mock for the model-downloader tests (no real network in unit tests).
mockito = "1"

[lints]
workspace = true
