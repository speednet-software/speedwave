[package]
name = "speedwave-runtime"
version = "0.10.0"
edition = "2021"
publish = false
description = "Container runtime abstraction for Speedwave (Lima, nerdctl, WSL2)"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
fs2 = "0.4"
log = { workspace = true }
regex = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.11"
base64 = "0.22"
rand = "0.8.6"
semver = "1"
url = "2"
json-patch = "4"
tokio = { version = "1", default-features = false, features = ["sync"] }
futures-core = "0.3"
async-stream = "0.3"
parking_lot = "0.12"
dashmap = "6"
shlex = "1.3"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
# Used for atomic plugin install staging — `tempdir_in(plugins_dir)`
# guarantees the staging dir lives on the same filesystem as the
# destination, which is the only way `rename(staging, dest)` is atomic.
tempfile = "3"

# --- Optional deps, gated behind the `audio-transcription` feature ---
# (only the Desktop crate enables this feature; the CLI stays lean — see
#  docs/adr/ADR-056-host-side-audio-transcription.md)
hound = { version = "3", optional = true }

[features]
# Host-side meeting transcription: WAV I/O now; whisper-rs / sherpa-onnx /
# cpal / reqwest are added to this feature's dep list in later phases
# (1b ModelStore, 1c Transcriber/Diarizer, 4 capture impls).
audio-transcription = ["dep:hound"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
