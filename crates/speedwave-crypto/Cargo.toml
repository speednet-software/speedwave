[package]
name = "speedwave-crypto"
version = "0.0.0"
edition = "2021"
description = "AES-SIV and HKDF primitives for Speedwave"
authors = ["Speednet"]
license = "Apache-2.0"
repository = "https://github.com/speednet-software/speedwave"
homepage = "https://github.com/speednet-software/speedwave"

[dependencies]
aes-siv = { version = "0.8.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.13"
sha2 = "0.11"
zeroize = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"
