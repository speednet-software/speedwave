[package]
name = "speedwave-pii-engine"
version = "0.1.0"
edition = "2021"
# Literal, not `.workspace = true`: this crate is vendored standalone (no ancestor workspace
# root) into the proxy image's isolated build context (ADR-073 F4, containers/proxy/Cargo.toml
# path dep) — same reasoning as proxy's own hardcoded package metadata below.
description = "AI platform connecting Claude Code with external services"
authors = ["Speednet"]
license = "Apache-2.0"
repository = "https://github.com/speednet-software/speedwave"
homepage = "https://github.com/speednet-software/speedwave"

[dependencies]
aes-siv = { version = "0.7.0", default-features = false, features = ["alloc"] }
base64 = "0.22"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

# Literal, not `workspace = true` (see package block above) — must stay byte-identical to root
# `[workspace.lints]`, enforced by `lint_tables_are_aligned` (consts.rs).
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"
