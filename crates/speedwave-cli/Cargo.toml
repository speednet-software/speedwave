[package]
name = "speedwave-cli"
version = "0.16.0"
edition = "2021"
publish = false
description = "CLI client for Speedwave — interactive Claude Code in a terminal"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "speedwave"
path = "src/main.rs"

[dependencies]
speedwave-runtime = { path = "../speedwave-runtime" }
anyhow = { workspace = true }
strum = { version = "0.28", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
self_update = { version = "0.42", default-features = false, features = ["archive-tar", "archive-zip", "compression-flate2", "rustls"] }
semver = "1"
log = { workspace = true }
env_logger = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
# Safe SetConsoleMode(ENABLE_VIRTUAL_TERMINAL_PROCESSING) probe for
# `terminal_restore` (already in-tree via env_logger -> anstream).
anstyle-query = "1.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
