# OCI Compose V2 — works with nerdctl compose (all platforms)
# Template variables substituted by render_compose() in speedwave-runtime.
# NEVER edit generated compose files — edit this template instead.

services:
  claude:
    image: ${IMAGE_CLAUDE}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_claude
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY}"
    tmpfs:
      - /tmp:noexec,nosuid,size=${CLAUDE_TMPFS}
    volumes:
      - ${CLAUDE_HOME}:/home/speedwave:rw
      - ${PROJECT_DIR}:/workspace
      - ${RESOURCES_DIR}:/speedwave/resources:ro
      - ${IDE_LOCK_DIR}:/home/speedwave/.claude/ide:ro
    environment:
      - CLAUDE_VERSION=${CLAUDE_VERSION}
      - MCP_HUB_PORT=${PORT_HUB}
      - CLAUDE_CODE_IDE_HOST_OVERRIDE=${IDE_HOST_OVERRIDE}
      # Connect to the Speedwave IDE Bridge on start so the user does not have to
      # run /ide and pick "Speedwave" by hand. The bridge lock file is always
      # mounted at ~/.claude/ide; this var forces the attempt even though the
      # container TTY is not a recognised IDE integrated terminal (the documented
      # "auto-detection fails" case). Value is the string `true` (not 1) per the
      # Claude Code env-vars reference.
      - CLAUDE_CODE_AUTO_CONNECT_IDE=true
      - ANTHROPIC_LOG=debug
    working_dir: /workspace
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${CLAUDE_CPUS}'
          memory: ${CLAUDE_MEMORY}

  # LiteLLM proxy (ADR-073): Claude Code's single LLM endpoint. Routes to the
  # configured providers; subscription OAuth passes through /anthropic
  # untouched. Worker-class token holder: per-provider API keys mount at
  # /tokens:ro, never enter the claude container. No host port — reachable
  # only on the per-project network. extra_hosts: local LLM backends on the
  # host (Ollama/LM Studio/llama.cpp) are reached via host.docker.internal
  # (ADR-062).
  litellm:
    image: ${IMAGE_LITELLM}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_litellm
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY}"
    tmpfs:
      - /tmp:noexec,nosuid,size=${LITELLM_TMPFS}
    volumes:
      - ${LITELLM_CONFIG_DIR}:/config:ro
      - ${TOKENS_DIR}/llm:/tokens:ro
      - ${LITELLM_USAGE_DIR}:/usage:rw
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${LITELLM_CPUS}'
          memory: ${LITELLM_MEM}

  mcp-hub:
    image: ${IMAGE_MCP_HUB}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_hub
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_HUB_TMPFS}
    environment:
      - PORT=${PORT_HUB}
      - WORKER_SLACK_URL=http://mcp-slack:${PORT_WORKER}
      - WORKER_SHAREPOINT_URL=http://mcp-sharepoint:${PORT_WORKER}
      - WORKER_REDMINE_URL=http://mcp-redmine:${PORT_WORKER}
      - WORKER_GITLAB_URL=http://mcp-gitlab:${PORT_WORKER}
      - WORKER_GITHUB_URL=http://mcp-github:${PORT_WORKER}
      - WORKER_ATLASSIAN_URL=http://mcp-atlassian:${PORT_WORKER}
      - WORKER_OFFICE_URL=http://mcp-office:${PORT_WORKER}
      - WORKER_PLAYWRIGHT_URL=http://mcp-playwright:${PORT_WORKER}
      - WORKER_CONTEXT7_URL=http://mcp-context7:${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
      # Also on the egress-less office network so the hub can reach mcp-office (ADR-055).
      - ${NETWORK_NAME}_office
    deploy:
      resources:
        limits:
          cpus: '${MCP_HUB_CPUS}'
          memory: ${MCP_HUB_MEM}

  mcp-slack:
    image: ${IMAGE_MCP_SLACK}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_slack
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_SLACK_TMPFS}
    volumes:
      - ${TOKENS_DIR}/slack:/tokens:ro
      # Slack file downloads land in /workspace/slack-files so the office
      # worker and Claude can read them (ADR-071; same rationale as sharepoint).
      - ${PROJECT_DIR}:/workspace:rw
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_SLACK_CPUS}'
          memory: ${MCP_SLACK_MEM}

  mcp-sharepoint:
    image: ${IMAGE_MCP_SHAREPOINT}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_sharepoint
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_SHAREPOINT_TMPFS}
    volumes:
      # :ro per ADR-060 — OAuth token refresh moved to the host-side `oauth`
      # worker. The SharePoint container only reads access_token / site_id /
      # base_path; refresh writes happen on the host (oauth worker) which
      # updates /tokens/access_token visible through this read-only mount.
      - ${TOKENS_DIR}/sharepoint:/tokens:ro
      - ${PROJECT_DIR}:/workspace:rw
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_SHAREPOINT_CPUS}'
          memory: ${MCP_SHAREPOINT_MEM}

  mcp-redmine:
    image: ${IMAGE_MCP_REDMINE}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_redmine
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_REDMINE_TMPFS}
    volumes:
      - ${TOKENS_DIR}/redmine:/tokens:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_REDMINE_CPUS}'
          memory: ${MCP_REDMINE_MEM}

  mcp-gitlab:
    image: ${IMAGE_MCP_GITLAB}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_gitlab
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_GITLAB_TMPFS}
    volumes:
      - ${TOKENS_DIR}/gitlab:/tokens:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_GITLAB_CPUS}'
          memory: ${MCP_GITLAB_MEM}

  mcp-github:
    image: ${IMAGE_MCP_GITHUB}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_github
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_GITHUB_TMPFS}
    volumes:
      - ${TOKENS_DIR}/github:/tokens:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_GITHUB_CPUS}'
          # Memory cap (and the 256m-vs-128m rationale) is the SSOT — see the
          # github descriptor in crates/speedwave-runtime/src/consts.rs.
          memory: ${MCP_GITHUB_MEM}

  mcp-atlassian:
    image: ${IMAGE_MCP_ATLASSIAN}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_atlassian
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_ATLASSIAN_TMPFS}
    volumes:
      - ${TOKENS_DIR}/atlassian:/tokens:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_ATLASSIAN_CPUS}'
          memory: ${MCP_ATLASSIAN_MEM}

  # Office documents worker — a pure file processor: no service credentials, no /tokens mount,
  # and NO network egress (attached only to the internal ${NETWORK_NAME}_office network — see ADR-055).
  # Mounts the project workspace read-write; outputs land under /workspace/.speedwave/office/.
  mcp-office:
    image: ${IMAGE_MCP_OFFICE}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_office
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # /tmp holds the LibreOffice per-call profile, matplotlib config, and conversion scratch space.
    # LibreOffice headless on a non-trivial .pptx can use a few hundred MB of temp space + RAM.
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_OFFICE_TMPFS}
    volumes:
      # No /tokens mount — this worker has no credentials. /workspace is its only window onto the host.
      - ${PROJECT_DIR}:/workspace:rw
    environment:
      - PORT=${PORT_WORKER}
      # Anti-DoS / resource limits. Defaults are baked into the worker; override here if needed.
      - OFFICE_MAX_INPUT_BYTES=52428800
      - OFFICE_MAX_PDF_PAGES=2000
      - OFFICE_TIMEOUT_STANDARD_MS=60000
      - OFFICE_TIMEOUT_LO_MS=120000
    networks:
      # Internal-only: no route to the gateway → no internet (defence in depth on top of the
      # application-level local-only resource loading in weasyprint/pandoc/LibreOffice).
      - ${NETWORK_NAME}_office
    deploy:
      resources:
        limits:
          cpus: '${MCP_OFFICE_CPUS}'
          memory: ${MCP_OFFICE_MEM}

  mcp-playwright:
    image: ${IMAGE_MCP_PLAYWRIGHT}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_playwright
    read_only: true
    # NOTE: Playwright image pre-creates pwuser (UID 1000); CONTAINER_USER is set
    # via substitution for consistency with other workers.
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Host gateway alias so Claude and plugins can navigate Playwright to
    # local dev servers (e.g. `http://host.docker.internal:4200` for Angular).
    # See ADR-062. The IP routing to the VM gateway already exists for every
    # container in the project network; this extra_hosts entry only adds the
    # canonical DNS name so callers don't need to know per-platform gateway IPs.
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY}"
    # Chromium uses /tmp for page caches and screenshot compositing.
    # tmpfs lives in RAM — keep it lean. Heavy screenshots return inline
    # as base64, not via /tmp.
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_PLAYWRIGHT_TMPFS}
    # Chromium IPC shared-memory requirement; the 64 MiB default causes ENOMEM
    # at page load time.
    shm_size: ${MCP_PLAYWRIGHT_SHM}
    # No /tokens mount — Playwright accesses only public URLs and has no credentials.
    # No /workspace mount in v1 — outputs return as base64 to shrink attack surface.
    environment:
      - PORT=${PORT_WORKER}
      # MCP-level request/response logging (uses the `debug` npm package;
      # output goes to stderr, visible in Desktop UI → System Health logs).
      # Covers tools/call, tool responses, and errors. Set to `pw:*` for full verbosity.
      - DEBUG=pw:mcp:*
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_PLAYWRIGHT_CPUS}'
          memory: ${MCP_PLAYWRIGHT_MEM}

  mcp-context7:
    image: ${IMAGE_MCP_CONTEXT7}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_context7
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_CONTEXT7_TMPFS}
    volumes:
      # Optional /tokens/api_key — anonymous mode (per-IP rate limit) if absent.
      # See docs/architecture/security.md for the third-party data-flow note.
      - ${TOKENS_DIR}/context7:/tokens:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_CONTEXT7_CPUS}'
          memory: ${MCP_CONTEXT7_MEM}

networks:
  ${NETWORK_NAME}:
    driver: bridge
  # Egress-less network for mcp-office (ADR-055). Only mcp-office and mcp-hub attach to it;
  # `internal: true` removes the gateway route so containers on it have no outbound internet.
  ${NETWORK_NAME}_office:
    driver: bridge
    internal: true
