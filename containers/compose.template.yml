# OCI Compose V2 — works with nerdctl compose (all platforms)
# Template variables substituted by render_compose() in speedwave-runtime.
# NEVER edit generated compose files — edit this template instead.

services:
  claude:
    image: ${IMAGE_CLAUDE}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_claude
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.lima.internal:${HOST_GATEWAY}"
      - "host.containers.internal:${HOST_GATEWAY}"
      - "host.docker.internal:${HOST_GATEWAY}"
      - "host.speedwave.internal:${HOST_GATEWAY}"
    tmpfs:
      - /tmp:noexec,nosuid,size=512m
    volumes:
      - ${CLAUDE_HOME}:/home/speedwave:rw
      - ${PROJECT_DIR}:/workspace
      - ${RESOURCES_DIR}:/speedwave/resources:ro
      - ${IDE_LOCK_DIR}:/home/speedwave/.claude/ide:ro
    environment:
      - CLAUDE_VERSION=${CLAUDE_VERSION}
      - MCP_HUB_PORT=${PORT_HUB}
      - CLAUDE_CODE_IDE_HOST_OVERRIDE=${IDE_HOST_OVERRIDE}
      - CLAUDE_CODE_EFFORT_LEVEL=max
    working_dir: /workspace
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: ${CLAUDE_MEMORY}

  mcp-hub:
    image: ${IMAGE_MCP_HUB}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_hub
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    environment:
      - PORT=${PORT_HUB}
      - WORKER_SLACK_URL=http://mcp-slack:${PORT_WORKER}
      - WORKER_SHAREPOINT_URL=http://mcp-sharepoint:${PORT_WORKER}
      - WORKER_REDMINE_URL=http://mcp-redmine:${PORT_WORKER}
      - WORKER_GITLAB_URL=http://mcp-gitlab:${PORT_WORKER}
      - WORKER_GITHUB_URL=http://mcp-github:${PORT_WORKER}
      - WORKER_ATLASSIAN_URL=http://mcp-atlassian:${PORT_WORKER}
      - WORKER_OFFICE_URL=http://mcp-office:${PORT_WORKER}
      - WORKER_PLAYWRIGHT_URL=http://mcp-playwright:${PORT_WORKER}
      - WORKER_CONTEXT7_URL=http://mcp-context7:${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
      # Also on the egress-less office network so the hub can reach mcp-office (ADR-055).
      - ${NETWORK_NAME}_office
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512m

  mcp-slack:
    image: ${IMAGE_MCP_SLACK}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_slack
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    volumes:
      - ${TOKENS_DIR}/slack:/tokens:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128m

  mcp-sharepoint:
    image: ${IMAGE_MCP_SHAREPOINT}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_sharepoint
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    volumes:
      # :ro per ADR-060 — OAuth token refresh moved to the host-side `oauth`
      # worker. The SharePoint container only reads access_token / site_id /
      # base_path; refresh writes happen on the host (oauth worker) which
      # updates /tokens/access_token visible through this read-only mount.
      - ${TOKENS_DIR}/sharepoint:/tokens:ro
      - ${PROJECT_DIR}:/workspace:rw
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128m

  mcp-redmine:
    image: ${IMAGE_MCP_REDMINE}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_redmine
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    volumes:
      - ${TOKENS_DIR}/redmine:/tokens:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128m

  mcp-gitlab:
    image: ${IMAGE_MCP_GITLAB}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_gitlab
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    volumes:
      - ${TOKENS_DIR}/gitlab:/tokens:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128m

  mcp-github:
    image: ${IMAGE_MCP_GITHUB}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_github
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    volumes:
      - ${TOKENS_DIR}/github:/tokens:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          # 256m (not the 128m other API workers use): Octokit composed with the
          # throttling + retry plugins has a heavier resident footprint than
          # @gitbeaker, and `octokit.paginate` buffers full result sets in memory
          # — a `listIssues({state:'all'})` on a busy repo OOM-kills a 128m cap.
          memory: 256m

  mcp-atlassian:
    image: ${IMAGE_MCP_ATLASSIAN}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_atlassian
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    volumes:
      - ${TOKENS_DIR}/atlassian:/tokens:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128m

  # Office documents worker — a pure file processor: no service credentials, no /tokens mount,
  # and NO network egress (attached only to the internal ${NETWORK_NAME}_office network — see ADR-055).
  # Mounts the project workspace read-write; outputs land under /workspace/.speedwave-office/.
  mcp-office:
    image: ${IMAGE_MCP_OFFICE}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_office
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # /tmp holds the LibreOffice per-call profile, matplotlib config, and conversion scratch space.
    # LibreOffice headless on a non-trivial .pptx can use a few hundred MB of temp space + RAM.
    tmpfs:
      - /tmp:noexec,nosuid,size=512m
    volumes:
      # No /tokens mount — this worker has no credentials. /workspace is its only window onto the host.
      - ${PROJECT_DIR}:/workspace:rw
    environment:
      - PORT=${PORT_WORKER}
      # Anti-DoS / resource limits. Defaults are baked into the worker; override here if needed.
      - OFFICE_MAX_INPUT_BYTES=52428800
      - OFFICE_MAX_PDF_PAGES=2000
      - OFFICE_TIMEOUT_STANDARD_MS=60000
      - OFFICE_TIMEOUT_LO_MS=120000
    networks:
      # Internal-only: no route to the gateway → no internet (defence in depth on top of the
      # application-level local-only resource loading in weasyprint/pandoc/LibreOffice).
      - ${NETWORK_NAME}_office
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

  mcp-playwright:
    image: ${IMAGE_MCP_PLAYWRIGHT}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_playwright
    read_only: true
    # NOTE: Playwright image pre-creates pwuser (UID 1000); CONTAINER_USER is set
    # via substitution for consistency with other workers.
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Chromium uses /tmp for page caches and screenshot compositing.
    # tmpfs lives in RAM — keep it lean. Heavy screenshots return inline
    # as base64, not via /tmp.
    tmpfs:
      - /tmp:noexec,nosuid,size=1g
    # Chromium IPC shared-memory requirement; the 64 MiB default causes ENOMEM
    # at page load time.
    shm_size: 2g
    # No /tokens mount — Playwright accesses only public URLs and has no credentials.
    # No /workspace mount in v1 — outputs return as base64 to shrink attack surface.
    environment:
      - PORT=${PORT_WORKER}
      # MCP-level request/response logging (uses the `debug` npm package;
      # output goes to stderr, visible in Desktop UI → System Health logs).
      # Covers tools/call, tool responses, and errors. Set to `pw:*` for full verbosity.
      - DEBUG=pw:mcp:*
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048m

  mcp-context7:
    image: ${IMAGE_MCP_CONTEXT7}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_context7
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    volumes:
      # Optional /tokens/api_key — anonymous mode (per-IP rate limit) if absent.
      # See docs/architecture/security.md for the third-party data-flow note.
      - ${TOKENS_DIR}/context7:/tokens:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128m

networks:
  ${NETWORK_NAME}:
    driver: bridge
  # Egress-less network for mcp-office (ADR-055). Only mcp-office and mcp-hub attach to it;
  # `internal: true` removes the gateway route so containers on it have no outbound internet.
  ${NETWORK_NAME}_office:
    driver: bridge
    internal: true
