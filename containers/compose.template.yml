
services:
  claude:
    image: ${IMAGE_CLAUDE}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_claude
    depends_on:
      proxy:
        condition: service_started
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY}"
    tmpfs:
      - /tmp:noexec,nosuid,size=${CLAUDE_TMPFS}
    volumes:
      - ${CLAUDE_HOME}:/home/speedwave:rw
      - ${PROJECT_DIR}:/workspace
      - ${RESOURCES_DIR}:/speedwave/resources:ro
      - ${IDE_LOCK_DIR}:/home/speedwave/.claude/ide:ro
      - ${PROXY_USAGE_DIR}:/usage:ro
    environment:
      - CLAUDE_VERSION=${CLAUDE_VERSION}
      - MCP_HUB_PORT=${PORT_HUB}
      - CLAUDE_CODE_IDE_HOST_OVERRIDE=${IDE_HOST_OVERRIDE}
      - CLAUDE_CODE_AUTO_CONNECT_IDE=true
      - ANTHROPIC_LOG=debug
      - SPEEDWAVE_BUNDLED_PLUGINS=${BUNDLED_PLUGINS}
      - SPEEDWAVE_BUNDLED_PLUGIN_MARKETPLACE=${BUNDLED_PLUGIN_MARKETPLACE}
    working_dir: /workspace
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${CLAUDE_CPUS}'
          memory: ${CLAUDE_MEMORY}

  proxy:
    image: ${IMAGE_PROXY}
    pull_policy: never
    restart: unless-stopped
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_proxy
    environment:
      - SPW_CONFIG_DIGEST=${PROXY_CONFIG_DIGEST}
      - POLICY_FILE=/policy/policy.json
      - POLICY_DIGEST=${POLICY_CONFIG_DIGEST}
      - AUDIT_DIR=/audit
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY}"
    tmpfs:
      - /tmp:noexec,nosuid,size=${PROXY_TMPFS}
    volumes:
      - ${PROXY_CONFIG_DIR}:/config:ro
      - ${TOKENS_DIR}/llm:/tokens:ro
      - ${PROXY_USAGE_DIR}:/usage:rw
      - ${POLICY_CONFIG_DIR}:/policy:ro
      - ${AUDIT_DIR}:/audit:rw
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${PROXY_CPUS}'
          memory: ${PROXY_MEM}

  mcp-hub:
    image: ${IMAGE_MCP_HUB}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_hub
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_HUB_TMPFS}
    volumes:
      - ${POLICY_CONFIG_DIR}:/policy:ro
      - ${AUDIT_DIR}:/audit:rw
    environment:
      - PORT=${PORT_HUB}
      - POLICY_FILE=/policy/policy.json
      - POLICY_DIGEST=${POLICY_CONFIG_DIGEST}
      - AUDIT_DIR=/audit
      - WORKER_SLACK_URL=http://mcp-slack:${PORT_WORKER}
      - WORKER_SHAREPOINT_URL=http://mcp-sharepoint:${PORT_WORKER}
      - WORKER_REDMINE_URL=http://mcp-redmine:${PORT_WORKER}
      - WORKER_GITLAB_URL=http://mcp-gitlab:${PORT_WORKER}
      - WORKER_GITHUB_URL=http://mcp-github:${PORT_WORKER}
      - WORKER_ATLASSIAN_URL=http://mcp-atlassian:${PORT_WORKER}
      - WORKER_OFFICE_URL=http://mcp-office:${PORT_WORKER}
      - WORKER_PLAYWRIGHT_URL=http://mcp-playwright:${PORT_WORKER}
      - WORKER_CONTEXT7_URL=http://mcp-context7:${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
      - ${NETWORK_NAME}_office
    deploy:
      resources:
        limits:
          cpus: '${MCP_HUB_CPUS}'
          memory: ${MCP_HUB_MEM}

  mcp-slack:
    image: ${IMAGE_MCP_SLACK}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_slack
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_SLACK_TMPFS}
    volumes:
      - ${TOKENS_DIR}/slack:/tokens:ro
      - ${PROJECT_DIR}:/workspace:rw
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_SLACK_CPUS}'
          memory: ${MCP_SLACK_MEM}

  mcp-sharepoint:
    image: ${IMAGE_MCP_SHAREPOINT}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_sharepoint
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_SHAREPOINT_TMPFS}
    volumes:
      - ${TOKENS_DIR}/sharepoint:/tokens:ro
      - ${PROJECT_DIR}:/workspace:rw
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_SHAREPOINT_CPUS}'
          memory: ${MCP_SHAREPOINT_MEM}

  mcp-redmine:
    image: ${IMAGE_MCP_REDMINE}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_redmine
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_REDMINE_TMPFS}
    volumes:
      - ${TOKENS_DIR}/redmine:/tokens:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_REDMINE_CPUS}'
          memory: ${MCP_REDMINE_MEM}

  mcp-gitlab:
    image: ${IMAGE_MCP_GITLAB}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_gitlab
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_GITLAB_TMPFS}
    volumes:
      - ${TOKENS_DIR}/gitlab:/tokens:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_GITLAB_CPUS}'
          memory: ${MCP_GITLAB_MEM}

  mcp-github:
    image: ${IMAGE_MCP_GITHUB}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_github
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_GITHUB_TMPFS}
    volumes:
      - ${TOKENS_DIR}/github:/tokens:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_GITHUB_CPUS}'
          memory: ${MCP_GITHUB_MEM}

  mcp-atlassian:
    image: ${IMAGE_MCP_ATLASSIAN}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_atlassian
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_ATLASSIAN_TMPFS}
    volumes:
      - ${TOKENS_DIR}/atlassian:/tokens:ro
      - ${PROJECT_DIR}:/workspace:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_ATLASSIAN_CPUS}'
          memory: ${MCP_ATLASSIAN_MEM}

  mcp-office:
    image: ${IMAGE_MCP_OFFICE}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_office
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_OFFICE_TMPFS}
    volumes:
      - ${PROJECT_DIR}:/workspace:rw
    environment:
      - PORT=${PORT_WORKER}
      - OFFICE_MAX_INPUT_BYTES=52428800
      - OFFICE_MAX_PDF_PAGES=2000
      - OFFICE_TIMEOUT_STANDARD_MS=60000
      - OFFICE_TIMEOUT_LO_MS=120000
    networks:
      - ${NETWORK_NAME}_office
    deploy:
      resources:
        limits:
          cpus: '${MCP_OFFICE_CPUS}'
          memory: ${MCP_OFFICE_MEM}

  mcp-playwright:
    image: ${IMAGE_MCP_PLAYWRIGHT}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_playwright
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY}"
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_PLAYWRIGHT_TMPFS}
    shm_size: ${MCP_PLAYWRIGHT_SHM}
    environment:
      - PORT=${PORT_WORKER}
      - DEBUG=pw:mcp:*
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_PLAYWRIGHT_CPUS}'
          memory: ${MCP_PLAYWRIGHT_MEM}

  mcp-context7:
    image: ${IMAGE_MCP_CONTEXT7}
    pull_policy: never
    container_name: ${COMPOSE_PREFIX}_${PROJECT_NAME}_mcp_context7
    read_only: true
    user: "${CONTAINER_USER}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,size=${MCP_CONTEXT7_TMPFS}
    volumes:
      - ${TOKENS_DIR}/context7:/tokens:ro
    environment:
      - PORT=${PORT_WORKER}
    networks:
      - ${NETWORK_NAME}
    deploy:
      resources:
        limits:
          cpus: '${MCP_CONTEXT7_CPUS}'
          memory: ${MCP_CONTEXT7_MEM}

networks:
  ${NETWORK_NAME}:
    driver: bridge
  ${NETWORK_NAME}_office:
    driver: bridge
    internal: true
