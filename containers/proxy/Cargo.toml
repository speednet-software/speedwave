[package]
name = "proxy"
version = "0.1.0"
edition = "2021"

# Not a workspace member — built inside the container image (see ADR-073).
# The empty [workspace] table below opts this crate out of the root workspace.
[workspace]

[[bin]]
name = "proxy"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "sync",
    "time",
] }
tokio-stream = "0.1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
rand = "0.8"
# default-features off drops the regex/color deps — keeps the scratch binary small.
env_logger = { version = "0.11", default-features = false }
# Native link (ADR-073 F4): the same crate the hub scans through over wasm, so proxy and hub
# tokenize identically for the same policy+key — one engine is the determinism guarantee.
speedwave-pii-engine = { path = "../../crates/pii-engine" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"
