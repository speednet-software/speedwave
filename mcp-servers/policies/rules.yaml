version: 3
rules:
  - id: EMAIL
    displayName: "E-mail address"
    patterns:
      - '[a-zA-Z0-9._%+-]{1,64}@[a-zA-Z0-9.-]{1,255}\.[a-zA-Z]{2,10}'

  - id: PHONE_PL
    displayName: "Polish phone number"
    patterns:
      - '\+?(?-u:\b)48[ -]?\d{3}[ -]?\d{3}[ -]?\d{3}(?-u:\b)'
      - '\+?(?-u:\b)48[ -]?\d{2}[ -]?\d{3}[ -]?\d{2}[ -]?\d{2}(?-u:\b)'

  - id: PESEL
    displayName: "PESEL"
    patterns: ['(?-u:\b)\d{11}(?-u:\b)']
    validator: pesel

  - id: NIP
    displayName: "NIP"
    patterns: ['(?-u:\b)\d{10}(?-u:\b)']
    validator: nip

  - id: IBAN
    displayName: "IBAN"
    patterns: ['[A-Z]{2}\d{2}[A-Z0-9]{4}\d{7}([A-Z0-9]?){0,16}']
    validator: iban

  - id: CARD
    displayName: "Payment card"
    patterns: ['(?-u:\b)(?:\d{4}[\s-]?){3}\d{4}(?-u:\b)']
    validator: luhn

  - id: API_KEY
    displayName: "API keys / technical secrets"
    patterns:
      - '(?-u:\b)sk-[a-zA-Z0-9]{20,}(?-u:\b)'
      - '(?-u:\b)AIza[a-zA-Z0-9_-]{35}(?-u:\b)'
      - '(?-u:\b)xox[bp]-[a-zA-Z0-9-]+(?-u:\b)'
      - '(?-u:\b)ghp_[a-zA-Z0-9]{36}(?-u:\b)'
