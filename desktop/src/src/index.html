<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Speedwave</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Anti-FOUC: reflect persisted theme mode onto <html> before app boot.
      (function () {
        try {
          var mode = localStorage.getItem('speedwave-theme-mode') || 'dark';
          var effective =
            mode === 'auto'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : mode;
          if (effective === 'dark') document.documentElement.classList.add('dark');
        } catch (_) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <app-root>
      <style id="boot-overlay-style">
        .boot-overlay {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: rgba(26, 26, 46, 0.92);
        }
        .boot-spinner {
          width: 32px;
          height: 32px;
          border: 3px solid #333;
          border-top-color: #e94560;
          border-radius: 50%;
          animation: boot-spin 0.8s linear infinite;
        }
        @keyframes boot-spin {
          to {
            transform: rotate(360deg);
          }
        }
        .boot-text {
          margin-top: 16px;
          color: #e0e0e0;
          font-family: monospace;
          font-size: 14px;
        }
      </style>
      <div class="boot-overlay">
        <div class="boot-spinner"></div>
        <p class="boot-text">Loading...</p>
      </div>
    </app-root>
  </body>
</html>
