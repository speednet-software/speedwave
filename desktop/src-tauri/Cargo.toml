[package]
name = "speedwave-desktop"
version = "0.0.0"
edition = "2021"
publish = false
description = "Speedwave desktop application — Tauri backend"
authors = ["Speednet"]
license = "Apache-2.0"
repository = "https://github.com/speednet-software/speedwave"
homepage = "https://github.com/speednet-software/speedwave"

[dependencies]
speedwave-runtime = { path = "../../crates/speedwave-runtime", features = ["audio-transcription"] }
speedwave-pii-engine = { path = "../../crates/pii-engine" }
speedwave-pii-ner = { path = "../../crates/pii-ner" }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
log = "0.4"
open = "5"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tauri-plugin-webdriver = { git = "https://github.com/Choochmeque/tauri-plugin-webdriver", rev = "b94eb81c9d4359cefdde15bd74d0f7d8a00065b6", optional = true }
url = "2"
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio-util = { version = "0.7", features = ["rt"] }
ctrlc = { version = "3", features = ["termination"] }
jsonschema = { version = "0.52", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVCaptureDevice",
    "AVMediaFormat",
    "block2",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
] }

[features]
e2e = ["dep:tauri-plugin-webdriver"]

[dev-dependencies]
fs2 = "0.4"
http-body-util = "0.1"
mockito = "1"
tower = { version = "0.5", features = ["util"] }
serial_test = "4"
speedwave-runtime = { path = "../../crates/speedwave-runtime", features = ["audio-transcription", "test-support"] }

[build-dependencies]
serde_json = "1"
speedwave-runtime = { path = "../../crates/speedwave-runtime" }
speedwave-version = { path = "../../crates/speedwave-version" }
tauri-build = { version = "2", features = [] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

[workspace]
