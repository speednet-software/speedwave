[package]
name = "speedwave-desktop"
version = "0.10.0"
edition = "2021"
publish = false
description = "Speedwave desktop application — Tauri backend"
authors = ["Speednet"]
license = "Apache-2.0"
repository = "https://github.com/speednet-software/speedwave"
homepage = "https://github.com/speednet-software/speedwave"

[dependencies]
speedwave-runtime = { path = "../../crates/speedwave-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
log = "0.4"
open = "5"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tauri-plugin-webdriver = { version = "0.2", optional = true }
url = "2"
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio-util = { version = "0.7", features = ["rt"] }
ctrlc = { version = "3", features = ["termination"] }
dashmap = "6"
futures-core = "0.3"
json-patch = "4"
# Hashes a `host_exec` recipe's serialized config for the confirmation-cache
# key (ADR-054) — an edited recipe gets a fresh hash and re-prompts. Same
# version as speedwave-runtime; RustCrypto, MIT/Apache, already in the tree.
sha2 = "0.11"
# JSON Schema validation for `plugin_save_settings` — refuses payloads
# that don't match the plugin's manifest-declared `settings_schema`.
# MIT-licensed; transitive deps already in the tree (regex, url, fancy-regex).
jsonschema = { version = "0.46", default-features = false }

[target.'cfg(unix)'.dependencies]
# Maps an extra file descriptor (fd 3) into the `host_exec` worker so it can
# write confirm-requests over it (ADR-054 §Confirmation flow). Unix-only — the
# `pre_exec` it uses internally has no Windows equivalent; on Windows the
# confirm channel is left unwired and the worker fails closed (see the NOTE in
# host_exec_process.rs::spawn_in). Apache-2.0/MIT; the unsafe `pre_exec` lives
# inside the crate, so `unsafe_code = "deny"` in [lints.rust] still holds for
# this crate.
command-fds = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Foundation",
] }

[features]
# Enable WebDriver server (port 4445) in release builds for E2E testing.
# Usage: cargo tauri build --features e2e
e2e = ["dep:tauri-plugin-webdriver"]

[dev-dependencies]
mockito = "1"
serial_test = "3"

[build-dependencies]
serde_json = "1"
speedwave-runtime = { path = "../../crates/speedwave-runtime" }
tauri-build = { version = "2", features = [] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_imports = "deny"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_docs = "warn"

# Empty workspace table keeps this crate standalone (not part of root workspace).
# Tauri has complex build dependencies — we don't want them in the main workspace.
[workspace]
