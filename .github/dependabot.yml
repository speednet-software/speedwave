version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: cron
      cronjob: '0 6 * * 1'
      timezone: Europe/Warsaw
    target-branch: dev
    labels:
      - dependencies

updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /desktop/src-tauri
      - /containers/proxy
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
      semver-major-days: 14
    ignore:
      - dependency-name: 'dirs'
        versions: ['>=7']
      - dependency-name: 'wasapi'
        versions: ['>=0.25']
      - dependency-name: 'jsonschema'
        versions: ['>=0.53']
      - dependency-name: 'rand'
        versions: ['>=0.9']

  - package-ecosystem: npm
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
      semver-major-days: 14

  - package-ecosystem: npm
    directory: /mcp-servers
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
      semver-major-days: 14
    ignore:
      - dependency-name: '@eslint/js'
        versions: ['>=10']
      - dependency-name: 'typescript'
        versions: ['>=7']

  - package-ecosystem: npm
    directory: /mcp-servers/playwright
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
      semver-major-days: 14

  - package-ecosystem: uv
    directory: /mcp-servers/office
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
      semver-major-days: 14

  - package-ecosystem: npm
    directory: /desktop/src
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
      semver-major-days: 14
    ignore:
      - dependency-name: 'vitest'
        versions: ['>=5']
      - dependency-name: '@vitest/coverage-v8'
        versions: ['>=5']
      - dependency-name: 'typescript'
        versions: ['>=6.1']

  - package-ecosystem: npm
    directory: /desktop/e2e
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
      semver-major-days: 14
    ignore:
      - dependency-name: 'typescript'
        versions: ['>=6']

  - package-ecosystem: github-actions
    directories:
      - /
      - '/.github/actions/*'
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3

  - package-ecosystem: docker
    directories:
      - /mcp-servers/hub
      - /mcp-servers/slack
      - /mcp-servers/sharepoint
      - /mcp-servers/redmine
      - /mcp-servers/gitlab
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: 'node'
        versions: ['>=25']
