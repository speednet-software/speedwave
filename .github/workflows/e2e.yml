name: E2E

on:
  pull_request:
  merge_group:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e-macos:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, ARM64]
    environment: e2e
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run the macOS rig lane
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          LOCAL_LLM_BASE_URL: ${{ secrets.LOCAL_LLM_BASE_URL }}
          LOCAL_LLM_API_KEY: ${{ secrets.LOCAL_LLM_API_KEY }}
          LOCAL_LLM_MODEL: ${{ secrets.LOCAL_LLM_MODEL }}
        run: SPEEDWAVE_MACOS_HOST="$(whoami)@127.0.0.1" bash scripts/e2e-vm.sh macos

  e2e-windows:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64]
    environment: e2e
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Put Git Bash ahead of the WSL launcher
        shell: powershell
        run: Add-Content $env:GITHUB_PATH 'C:\Program Files\Git\bin'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run the Windows rig lane
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          LOCAL_LLM_BASE_URL: ${{ secrets.LOCAL_LLM_BASE_URL }}
          LOCAL_LLM_API_KEY: ${{ secrets.LOCAL_LLM_API_KEY }}
          LOCAL_LLM_MODEL: ${{ secrets.LOCAL_LLM_MODEL }}
        run: SPEEDWAVE_WINDOWS_HOST="$USERNAME@127.0.0.1" bash scripts/e2e-vm.sh windows
