name: E2E

on:
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  e2e-macos:
    concurrency:
      group: rig-macos
      cancel-in-progress: false
    runs-on: [self-hosted, macOS, ARM64]
    environment: e2e
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run the macOS rig lane
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          LOCAL_LLM_BASE_URL: ${{ secrets.LOCAL_LLM_BASE_URL }}
          LOCAL_LLM_API_KEY: ${{ secrets.LOCAL_LLM_API_KEY }}
          LOCAL_LLM_MODEL: ${{ secrets.LOCAL_LLM_MODEL }}
        run: SPEEDWAVE_MACOS_HOST="$(whoami)@127.0.0.1" bash scripts/e2e-vm.sh macos

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-screenshots-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: .e2e-artifacts/**
          if-no-files-found: ignore
          retention-days: 7

  e2e-windows:
    concurrency:
      group: rig-windows
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64]
    environment: e2e
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Put Git Bash ahead of the WSL launcher
        shell: powershell
        run: Add-Content $env:GITHUB_PATH 'C:\Program Files\Git\bin'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run the Windows rig lane
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          LOCAL_LLM_BASE_URL: ${{ secrets.LOCAL_LLM_BASE_URL }}
          LOCAL_LLM_API_KEY: ${{ secrets.LOCAL_LLM_API_KEY }}
          LOCAL_LLM_MODEL: ${{ secrets.LOCAL_LLM_MODEL }}
        run: SPEEDWAVE_WINDOWS_HOST="$USERNAME@127.0.0.1" bash scripts/e2e-vm.sh windows

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-screenshots-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: .e2e-artifacts/**
          if-no-files-found: ignore
          retention-days: 7
