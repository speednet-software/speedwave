name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["slawomir-it", "kamilparczewski", "Alwox", "MikolajKakol", "klewandowski-speednet"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Add official plugin marketplace
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: npx -y @anthropic-ai/claude-code@2.1.296 plugin marketplace add anthropics/claude-plugins-official

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugins: 'mattpocock-skills@claude-plugins-official'
          prompt: |
            /mattpocock-skills:code-review origin/${{ github.base_ref }}

            This run is non-interactive CI on pull request ${{ github.repository }}#${{ github.event.pull_request.number }}. Nobody can answer questions, so never ask; decide and continue.

            - Fixed point: origin/${{ github.base_ref }}. HEAD is the pull request head commit.
            - Issue tracker: GitHub, read-only through `gh`. Skip any step that says to run /setup-matt-pocock-skills.
            - Spec: the pull request title and body, read with `gh pr view ${{ github.event.pull_request.number }} --json title,body`. Do not look for any other spec source. If the body is empty, skip the Spec axis and say so in the report.
            - Add this line to both sub-agent prompts: "Do the review yourself. Do not invoke any skill or slash command and do not spawn sub-agents."
            - When the report is ready, post it as a single comment with `gh pr comment ${{ github.event.pull_request.number }} --body "<report>"`. Post nothing else.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Agent,Task,Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git show:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*)"
