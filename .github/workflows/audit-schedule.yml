name: Audit schedule

on:
  schedule:
    - cron: '13 4 * * *'
  workflow_dispatch: {}

concurrency:
  group: audit-schedule
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup toolchain (Node + Rust + cache)
        uses: ./.github/actions/setup-toolchain
        with:
          rust-cache-workspaces: |
            . -> target
            ./desktop/src-tauri -> target
          node-cache-dependency-path: |
            mcp-servers/package-lock.json
            desktop/src/package-lock.json

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Full absolute audit, file or update one issue on red
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: scripts/audit-issue.sh
