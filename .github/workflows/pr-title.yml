name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install commitlint
        run: npm ci

      - name: Resolve the message to validate
        id: message
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_GROUP_MESSAGE: ${{ github.event.merge_group.head_commit.message }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          message="$(bash scripts/resolve-pr-title-message.sh)"
          echo "message=$message" >>"$GITHUB_OUTPUT"

      - name: Validate conventional commit message
        env:
          MESSAGE: ${{ steps.message.outputs.message }}
        run: echo "$MESSAGE" | npx --no -- commitlint
