name: Desktop Build

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".node-version"
      - ".github/actions/download-nodejs/**"
      - ".github/actions/download-wsl-resources/**"
      - "mcp-servers/package.json"
      - "mcp-servers/package-lock.json"
      - "mcp-servers/shared/**"
      - "mcp-servers/os/**"
      - "containers/**"
      - "scripts/bundle-build-context.sh"
      - "scripts/bundle-build-context.ps1"
      - "scripts/check-nsis-update-reset.ps1"
      - ".github/workflows/desktop-build.yml"
  push:
    branches: [main, dev]
    paths:
      - "desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".node-version"
      - ".github/actions/download-nodejs/**"
      - ".github/actions/download-wsl-resources/**"
      - "mcp-servers/package.json"
      - "mcp-servers/package-lock.json"
      - "mcp-servers/shared/**"
      - "mcp-servers/os/**"
      - "containers/**"
      - "scripts/bundle-build-context.sh"
      - "scripts/bundle-build-context.ps1"
      - "scripts/check-nsis-update-reset.ps1"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Determine build matrix
        id: set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          macos_arm='{"platform":"macos-latest","args":"--target aarch64-apple-darwin","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin"}'
          macos_x64='{"platform":"macos-latest","args":"--target x86_64-apple-darwin","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin"}'
          windows='{"platform":"windows-latest","args":"","rust-targets":""}'
          if [ "$EVENT_NAME" != "pull_request" ]; then
            include="$macos_arm,$macos_x64,$windows"
          else
            files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')"
            if grep -qE '^(desktop/src-tauri/windows/|desktop/src-tauri/tauri\.windows\.conf\.json$|scripts/check-nsis-update-reset\.ps1$|\.github/workflows/desktop-build\.yml$)' <<< "$files"; then
              include="$macos_arm,$windows"
            else
              include="$macos_arm"
            fi
          fi
          echo "matrix={\"include\":[$include]}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix-setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
    timeout-minutes: 75
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Use a short cargo target dir (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          echo 'CARGO_TARGET_DIR=D:\st' >> "$GITHUB_ENV"
          # Cache key folds in the runner image: a VS bump invalidates CMakeCache generators.
          echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Cache the short cargo target dir (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: D:\st
          key: ${{ runner.os }}-${{ env.IMAGE_VERSION }}-cargo-desktop-bundle-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.IMAGE_VERSION }}-cargo-desktop-bundle-

      - name: Setup toolchain (Node + Rust + cache)
        uses: ./.github/actions/setup-toolchain
        with:
          rust-targets: ${{ matrix.rust-targets }}
          rust-cache-workspaces: |
            . -> target
            ./desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop/src

      - name: Prepare desktop bundle
        uses: ./.github/actions/prepare-desktop-bundle
        with:
          platform: ${{ matrix.platform }}
          args: ${{ matrix.args }}

      - name: Build Tauri app
        working-directory: desktop/src-tauri
        shell: bash
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MATRIX_ARGS: ${{ matrix.args }}
        run: |
          # Split MATRIX_ARGS into an array (word-split, no glob expansion).
          read -ra ARGS <<< "$MATRIX_ARGS"
          # No signing key (fork PR / Dependabot) → unsigned bundle.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx --prefix ../src tauri build "${ARGS[@]}" --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx --prefix ../src tauri build "${ARGS[@]}"
          fi

      - name: Check an NSIS /UPDATE install removes files the release no longer ships (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/check-nsis-update-reset.ps1 -BundleDir "$env:CARGO_TARGET_DIR\release\bundle\nsis"
