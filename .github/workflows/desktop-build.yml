name: Desktop Build

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".node-version"
      - ".github/actions/download-nodejs/**"
      - ".github/actions/download-wsl-resources/**"
      - "mcp-servers/package.json"
      - "mcp-servers/package-lock.json"
      - "mcp-servers/shared/**"
      - "mcp-servers/os/**"
      - "scripts/bundle-build-context.sh"
      - "scripts/bundle-build-context.ps1"
  push:
    branches: [main, dev]
    paths:
      - "desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".node-version"
      - ".github/actions/download-nodejs/**"
      - ".github/actions/download-wsl-resources/**"
      - "mcp-servers/package.json"
      - "mcp-servers/package-lock.json"
      - "mcp-servers/shared/**"
      - "mcp-servers/os/**"
      - "scripts/bundle-build-context.sh"
      - "scripts/bundle-build-context.ps1"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Determine build matrix
        id: set
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'matrix={"include":[{"platform":"macos-latest","args":"--target aarch64-apple-darwin","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"platform":"macos-latest","args":"--target aarch64-apple-darwin","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin"},{"platform":"macos-latest","args":"--target x86_64-apple-darwin","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin"},{"platform":"windows-latest","args":"","rust-targets":""}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix-setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
    timeout-minutes: 45
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup toolchain (Node + Rust + cache)
        uses: ./.github/actions/setup-toolchain
        with:
          rust-targets: ${{ matrix.rust-targets }}
          rust-cache-workspaces: |
            . -> target
            ./desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop/src

      - name: Prepare desktop bundle
        uses: ./.github/actions/prepare-desktop-bundle
        with:
          platform: ${{ matrix.platform }}
          args: ${{ matrix.args }}

      - name: Build Tauri app
        working-directory: desktop/src-tauri
        shell: bash
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MATRIX_ARGS: ${{ matrix.args }}
        run: |
          # Split MATRIX_ARGS into an array (word-split, no glob expansion).
          read -ra ARGS <<< "$MATRIX_ARGS"
          # No signing key (fork PR / Dependabot) → unsigned bundle.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx --prefix ../src tauri build "${ARGS[@]}" --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx --prefix ../src tauri build "${ARGS[@]}"
          fi
