name: Desktop Build

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".node-version"
      - ".github/actions/download-nodejs/**"
      - ".github/actions/download-wsl-resources/**"
      - "mcp-servers/package.json"
      - "mcp-servers/package-lock.json"
      - "mcp-servers/shared/**"
      - "mcp-servers/os/**"
      # Bundled into build-context/ (proxy image + compose template) — a
      # containers-only change still affects the desktop bundle.
      - "containers/**"
      - "scripts/bundle-build-context.sh"
      - "scripts/bundle-build-context.ps1"
  push:
    branches: [main, dev]
    paths:
      - "desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".node-version"
      - ".github/actions/download-nodejs/**"
      - ".github/actions/download-wsl-resources/**"
      - "mcp-servers/package.json"
      - "mcp-servers/package-lock.json"
      - "mcp-servers/shared/**"
      - "mcp-servers/os/**"
      # Bundled into build-context/ (proxy image + compose template) — a
      # containers-only change still affects the desktop bundle.
      - "containers/**"
      - "scripts/bundle-build-context.sh"
      - "scripts/bundle-build-context.ps1"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Determine build matrix
        id: set
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'matrix={"include":[{"platform":"macos-latest","args":"--target aarch64-apple-darwin","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"platform":"macos-latest","args":"--target aarch64-apple-darwin","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin"},{"platform":"macos-latest","args":"--target x86_64-apple-darwin","rust-targets":"aarch64-apple-darwin,x86_64-apple-darwin"},{"platform":"windows-latest","args":"","rust-targets":""}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix-setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-setup.outputs.matrix) }}
    timeout-minutes: 75
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      # The runner's checkout base + the ggml-vulkan CMake scratch crosses MAX_PATH (C1083);
      # same escape as test.yml's desktop-windows-check.
      - name: Use a short cargo target dir (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          echo 'CARGO_TARGET_DIR=D:\st' >> "$GITHUB_ENV"
          # Cache key folds in the runner image: a VS bump invalidates CMakeCache generators.
          echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      # rust-cache (setup-toolchain) caches workspace-relative target dirs only — D:\st
      # needs its own cache entry, same pattern as test.yml's desktop-windows-check.
      - name: Cache the short cargo target dir (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: D:\st
          key: ${{ runner.os }}-${{ env.IMAGE_VERSION }}-cargo-desktop-bundle-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.IMAGE_VERSION }}-cargo-desktop-bundle-

      - name: Setup toolchain (Node + Rust + cache)
        uses: ./.github/actions/setup-toolchain
        with:
          rust-targets: ${{ matrix.rust-targets }}
          rust-cache-workspaces: |
            . -> target
            ./desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop/src

      - name: Prepare desktop bundle
        uses: ./.github/actions/prepare-desktop-bundle
        with:
          platform: ${{ matrix.platform }}
          args: ${{ matrix.args }}

      - name: Build Tauri app
        working-directory: desktop/src-tauri
        shell: bash
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MATRIX_ARGS: ${{ matrix.args }}
        run: |
          # Split MATRIX_ARGS into an array (word-split, no glob expansion).
          read -ra ARGS <<< "$MATRIX_ARGS"
          # No signing key (fork PR / Dependabot) → unsigned bundle.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx --prefix ../src tauri build "${ARGS[@]}" --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx --prefix ../src tauri build "${ARGS[@]}"
          fi
