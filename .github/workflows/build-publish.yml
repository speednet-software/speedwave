name: Build & Publish

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      version:
        type: string
        required: true
      tag:
        type: string
        required: true
      prerelease:
        type: boolean
        required: true
      notes:
        type: string
        required: true

permissions: {}

jobs:
  draft:
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Create or reuse the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail

          RELEASE_ID=$(gh release view "$TAG" --repo "$REPO" --json databaseId --jq '.databaseId' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            echo "Reusing existing release $RELEASE_ID for tag $TAG"
            echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOTES_FILE="$(mktemp)"
          printf '%s' "$NOTES" > "$NOTES_FILE"

          LATEST_FLAG="--latest"
          if [ "$PRERELEASE" = "true" ]; then
            LATEST_FLAG="--prerelease"
          fi

          gh release create "$TAG" \
            --repo "$REPO" \
            --title "Speedwave $TAG" \
            --notes-file "$NOTES_FILE" \
            --draft \
            $LATEST_FLAG

          RELEASE_ID=$(gh release view "$TAG" --repo "$REPO" --json databaseId --jq '.databaseId')
          echo "Created draft release $RELEASE_ID for tag $TAG"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: draft
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            arch_label: "macOS_Apple_Silicon"
            target: aarch64-apple-darwin
            archive: tar.gz
          - platform: windows-latest
            args: ""
            arch_label: ""
            target: x86_64-pc-windows-msvc
            archive: zip
    timeout-minutes: 75
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0

      - name: Use a short cargo target dir (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          echo 'CARGO_TARGET_DIR=D:\st' >> "$GITHUB_ENV"
          # Cache key folds in the runner image: a VS bump invalidates CMakeCache generators.
          echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Cache the short cargo target dir (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: D:\st
          key: ${{ runner.os }}-${{ env.IMAGE_VERSION }}-cargo-desktop-bundle-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.IMAGE_VERSION }}-cargo-desktop-bundle-

      - name: Setup toolchain (Node + Rust + cache)
        uses: ./.github/actions/setup-toolchain
        with:
          rust-targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
          rust-cache-workspaces: "./desktop/src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop/src

      - name: Configure macOS code signing
        if: matrix.platform == 'macos-latest'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_VAL: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_VAL: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_VAL: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ]; then
            echo "::add-mask::$CERT"
            echo "::add-mask::$CERT_PASSWORD"
            echo "::add-mask::$SIGNING_IDENTITY"
            echo "::add-mask::$APPLE_ID_VAL"
            echo "::add-mask::$APPLE_PASSWORD_VAL"
            echo "::add-mask::$APPLE_TEAM_ID_VAL"
            {
              echo "APPLE_CERTIFICATE=$CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID_VAL"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD_VAL"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_VAL"
            } >> "$GITHUB_ENV"
            echo "::notice::macOS code signing configured"
          else
            echo "::notice::macOS code signing skipped (no APPLE_CERTIFICATE secret)"
          fi

      - name: Import Apple signing certificate to keychain
        if: matrix.platform == 'macos-latest' && env.APPLE_CERTIFICATE != ''
        shell: bash
        env:
          CERT: ${{ env.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ env.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_FILE="$RUNNER_TEMP/apple-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          # Random password — keychain is ephemeral, destroyed with the runner.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          echo "$CERT" | base64 --decode > "$CERT_FILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Prepend the build keychain to the search list (bash 3.2: no mapfile).
          _existing_keychains=()
          while IFS= read -r _kc; do
            [ -n "$_kc" ] && _existing_keychains+=("$_kc")
          done < <(security list-keychains -d user | tr -d '"' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${_existing_keychains[@]}"

          security import "$CERT_FILE" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$CERT_FILE"

          # Empty identity would make the grep below match any line.
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "::error::APPLE_SIGNING_IDENTITY is empty — check the repository secret"
            exit 1
          fi
          # Verify the identity is resolvable (-qF: identity contains `()`).
          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
               | grep -qF "$APPLE_SIGNING_IDENTITY"; then
            echo "::error::APPLE_SIGNING_IDENTITY not found in imported keychain"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "::notice::Apple signing identity imported and verified in build keychain"

      - name: Configure Windows code signing
        if: matrix.platform == 'windows-latest'
        uses: ./.github/actions/azure-signing-login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          account: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}

      - name: Cache the Artifact Signing token (Windows)
        if: matrix.platform == 'windows-latest' && vars.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: az account get-access-token --resource https://codesigning.azure.net --output none

      - name: Prepare desktop bundle
        uses: ./.github/actions/prepare-desktop-bundle
        with:
          platform: ${{ matrix.platform }}
          args: ${{ matrix.args }}

      - name: Compute Tauri version config
        id: version_config
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "config={\"version\":\"$VERSION\"}" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SPEEDWAVE_VERSION: ${{ inputs.version }}
        with:
          projectPath: desktop/src-tauri
          releaseId: ${{ needs.draft.outputs.release_id }}
          prerelease: ${{ inputs.prerelease }}
          args: ${{ format('{0} --config {1}', matrix.args, steps.version_config.outputs.config) }}
          releaseAssetNamePattern: ${{ matrix.arch_label != '' && format('[name]_[version]_{0}[setup][ext]', matrix.arch_label) || '' }}

      - name: Check the build did not modify a tracked file
        shell: bash
        run: git diff --exit-code

      - name: Package CLI (unix)
        if: matrix.archive == 'tar.gz'
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          ARCHIVE_NAME="speedwave-v${VERSION}-${TARGET}.tar.gz"
          chmod +x desktop/src-tauri/cli/speedwave
          tar -czf "$ARCHIVE_NAME" -C desktop/src-tauri/cli speedwave
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Package CLI (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $archiveName = "speedwave-v${env:VERSION}-${env:TARGET}.zip"
          Compress-Archive -Path "desktop/src-tauri/cli/speedwave.exe" -DestinationPath $archiveName
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload CLI to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
          TAG_NAME: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG_NAME" "$ARCHIVE_NAME" --repo "$REPO" --clobber

  publish:
    needs: [draft, publish-tauri]
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
          VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          RID: ${{ needs.draft.outputs.release_id }}
        run: bash scripts/verify-release-assets.sh

      - name: Publish release (draft → live)
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
          REPO: ${{ github.repository }}
          RID: ${{ needs.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$REPO/releases/$RID" -f draft=false
          echo "Release published successfully"

  delete-draft-on-failure:
    needs: [draft, publish-tauri, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Delete the draft release left behind by this failed run
        env:
          GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          STATE=$(gh release view "$TAG_NAME" --repo "$REPO" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [ "$STATE" = "true" ]; then
            gh release delete "$TAG_NAME" --repo "$REPO" --yes
            echo "Deleted draft release for $TAG_NAME"
          else
            echo "No draft release to delete for $TAG_NAME (state: ${STATE:-not found})"
          fi
