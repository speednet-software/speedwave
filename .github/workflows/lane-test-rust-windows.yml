name: lane-test-rust-windows

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-rust-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup toolchain (Node + Rust + cache)
        uses: ./.github/actions/setup-toolchain
        with:
          node: 'false'
          cargo-cache-paths: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          cargo-cache-key: ${{ runner.os }}-cargo-runtime-${{ hashFiles('Cargo.lock') }}
          cargo-cache-restore-keys: ${{ runner.os }}-cargo-runtime-

      - name: cargo test (full suite incl. test-support)
        run: cargo test -p speedwave-runtime -p speedwave-cli -p speedwave-version --features speedwave-runtime/test-support,speedwave-version/cli

      - name: Verify .gitattributes survives core.autocrlf=true checkout
        shell: bash
        env:
          REPO_PATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/recheck"
          rm -rf "$tmp"
          git -c core.autocrlf=true clone "$REPO_PATH" "$tmp"
          cd "$tmp"
          fail=0
          while IFS= read -r -d '' f; do
            if ! cmp -s <(tr -d "$(printf '\r')" < "$f") "$f"; then
              echo "::error file=$f::CRLF detected after autocrlf=true checkout — .gitattributes regression"
              fail=1
            fi
          done < <(find containers -type f -name '*.sh' -print0)
          exit "$fail"
