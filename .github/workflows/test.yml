name: Tests

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            containers/proxy/target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock', 'containers/proxy/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-servers/package-lock.json

      - name: Install dependencies
        run: |
          cargo fetch
          npm ci --ignore-scripts
          cd mcp-servers && npm ci

      - name: Install wasm toolchain (PII engine)
        run: |
          rustup target add wasm32-unknown-unknown
          npm install -g wasm-pack

      - name: Install cmake
        run: brew install cmake

      - name: Rust clippy
        run: make check-clippy

      - name: Proxy clippy
        run: make check-proxy-clippy

      - name: Format check
        run: make check-fmt

      - name: MCP type-check (build shared first)
        working-directory: mcp-servers
        run: |
          (cd shared && npx tsc)
          # hub resolves @speedwave/policy-engine types from policies/dist, so build (not noEmit).
          (cd policies && npm run build:wasm)
          (cd policies && npx tsc)
          # `playwright` is a Container-built bridge worker — no TS sources, no tsconfig.
          for ws in policies hub slack sharepoint redmine gitlab os atlassian context7 github oauth office; do
            echo "tsc --noEmit $ws"
            (cd "$ws" && npx tsc --noEmit)
          done

      - name: MCP ESLint
        working-directory: mcp-servers
        run: npx eslint .

  test-rust:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            containers/proxy/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock', 'containers/proxy/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Install cmake
        run: brew install cmake

      - name: Fetch cargo dependencies
        run: cargo fetch

      - name: Install cargo-llvm-cov
        run: |
          rustup component add llvm-tools-preview
          curl -fsSLO https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-aarch64-apple-darwin.tar.gz
          echo "7e821a6c90c0884f79f759f5d9be50799ade67bb82515186d922f26032ef43b8  cargo-llvm-cov-aarch64-apple-darwin.tar.gz" | shasum -a 256 -c -
          tar -xzf cargo-llvm-cov-aarch64-apple-darwin.tar.gz -C "$HOME/.cargo/bin" cargo-llvm-cov

      - name: Rust coverage (>=70% lines, catches an untested regression before merge)
        run: make coverage-rust

      - name: Audio transcription tests
        run: make test-transcription

      - name: Proxy tests
        run: make test-proxy

  test-rust-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-runtime-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-runtime-

      - name: cargo test (full suite incl. test-support)
        run: cargo test -p speedwave-runtime -p speedwave-cli -p speedwave-version --features speedwave-runtime/test-support,speedwave-version/cli

      - name: Verify .gitattributes survives core.autocrlf=true checkout
        shell: bash
        env:
          REPO_PATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/recheck"
          rm -rf "$tmp"
          git -c core.autocrlf=true clone "$REPO_PATH" "$tmp"
          cd "$tmp"
          fail=0
          while IFS= read -r -d '' f; do
            if ! cmp -s <(tr -d "$(printf '\r')" < "$f") "$f"; then
              echo "::error file=$f::CRLF detected after autocrlf=true checkout — .gitattributes regression"
              fail=1
            fi
          done < <(find containers -type f -name '*.sh' -print0)
          exit "$fail"

  test-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: mcp-servers/package-lock.json

      - name: Install wasm toolchain (PII engine)
        run: |
          rustup target add wasm32-unknown-unknown
          npm install -g wasm-pack

      - name: Install dependencies
        working-directory: mcp-servers
        run: npm ci

      - name: MCP tests + coverage
        run: make coverage-mcp

      - name: Office Python script tests
        run: make test-mcp-office-py

  test-desktop:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-desktop-

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/src/package-lock.json

      - name: Install wasm toolchain (PII engine)
        run: |
          rustup target add wasm32-unknown-unknown
          npm install -g wasm-pack

      - name: Install dependencies
        working-directory: desktop/src-tauri
        run: cargo fetch

      - name: Install Angular dependencies
        working-directory: desktop/src
        run: npm ci

      - name: Install mcp-servers dependencies
        working-directory: mcp-servers
        run: npm ci

      - name: Create resource stubs for Tauri build script
        run: scripts/create-desktop-stubs.sh

      - name: Desktop clippy
        working-directory: desktop/src-tauri
        env:
          SPEEDWAVE_ALLOW_BUNDLE_STUBS: "1"
        run: cargo clippy -- -D warnings

      - name: Desktop tests
        env:
          SPEEDWAVE_ALLOW_BUNDLE_STUBS: "1"
        run: make test-desktop-run

      - name: mcp-os bundle upgrade-path test
        run: make test-mcp-os-bundle

      - name: Angular ESLint
        working-directory: desktop/src
        run: npx eslint 'src/**/*.ts'

      - name: Angular tests + coverage
        working-directory: desktop/src
        run: npx ng test --no-watch --coverage

      - name: Install bats
        run: brew install bats-core

      - name: Desktop config tests (fast)
        run: make test-desktop-config

      - name: Release-gate tests (gh shim)
        run: make test-release-gate

      - name: Desktop bats tests
        run: make test-desktop-build

  test-cli:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-cli-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cli-

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version

      - name: Install bats
        run: brew install bats-core

      - name: CLI e2e trio (no VM)
        run: make test-e2e

      - name: Entrypoint tests
        run: make test-entrypoint

  ci-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: CI workflow shape tests
        run: make test-ci

      - name: Install actionlint
        run: |
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL -o checksums.txt https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          grep 'actionlint_1.7.12_linux_amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          chmod +x actionlint

      - name: actionlint (invalid workflow, e.g. typo'd needs, bad expressions, unknown events/inputs, shellcheck of run steps)
        run: ./actionlint -color

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup toolchain (Node + Rust + cache)
        uses: ./.github/actions/setup-toolchain
        with:
          rust-cache-workspaces: |
            . -> target
            ./desktop/src-tauri -> target
          node-cache-dependency-path: |
            mcp-servers/package-lock.json
            desktop/src/package-lock.json

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Diff known advisories between the target branch and the PR head
        env:
          AUDIT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: scripts/audit-diff.sh

  swift:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Fetch release/* branches
        run: git fetch origin '+refs/heads/release/*:refs/remotes/origin/release/*'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Compute app version
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "SPEEDWAVE_VERSION=$(cargo run --quiet -p speedwave-version --bin speedwave-version --features cli -- version --branch "$BRANCH")" >> "$GITHUB_ENV"

      - name: Build native macOS CLI binaries (universal)
        run: scripts/build-native-macos.sh

      - name: Run Swift tests
        run: make test-swift

      - name: Install bats
        run: brew install bats-core

      - name: Native CLI embedded-plist guards
        run: make test-native-cli-plist

      - name: Check the build did not modify a tracked file
        run: git diff --exit-code

  desktop-windows-check:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: D:\st
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Capture runner image version
        run: echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            D:\st
          key: ${{ runner.os }}-${{ env.IMAGE_VERSION }}-cargo-desktop-check-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.IMAGE_VERSION }}-cargo-desktop-check-

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $out = scripts/install-vulkan-sdk.ps1
          $out | Write-Output
          $root = (($out | Select-String -Pattern '^VULKAN_SDK=').Line) -replace '^VULKAN_SDK=', ''
          "VULKAN_SDK=$root" | Add-Content $env:GITHUB_ENV
          Join-Path $root 'runtime\x64' | Add-Content $env:GITHUB_PATH

      - name: Create resource stubs for Tauri build script
        run: scripts/create-desktop-stubs.sh

      - name: cargo check speedwave-desktop
        working-directory: desktop/src-tauri
        env:
          SPEEDWAVE_ALLOW_BUNDLE_STUBS: "1"
        run: cargo check --all-targets

      - name: cargo test speedwave-runtime transcription (windows)
        run: |
          LIST="$(cargo test -p speedwave-runtime --lib --features audio-transcription "transcription::" -- --list)"
          grep -q 'transcription::audio_windows' <<<"$LIST" || { echo '::error::no transcription::audio_windows tests matched the filter'; exit 1; }
          cargo test -p speedwave-runtime --lib --features audio-transcription "transcription::"
          # Integration targets (transcription_pipeline_e2e) must still compile with the
          # feature — check-only, so nothing links libwhisper for zero runnable tests.
          cargo check --tests -p speedwave-runtime --features audio-transcription

      - name: cargo test speedwave-desktop (windows-only)
        working-directory: desktop/src-tauri
        env:
          SPEEDWAVE_ALLOW_BUNDLE_STUBS: "1"
        run: >
          cargo test --bins --
          desktop_log_dir_windows_path_under_local_appdata_logs
          set_os_integration_enabled_rejects_on_windows
          validate_os_integrations_returns_empty_on_windows
          resolve_cli_source_finds_resources_path
          full_cleanup_calls_in_order_on_windows
          calls_compose_down_for_each_project
          empty_projects_is_noop
          failure_does_not_abort_remaining_projects
          cli_session_appearing_during_compose_down_loop_skips_stop_vm
          cli_session_appearing_mid_batch_aborts_remaining_teardown
          windows_nsis_resolves_exe_parent_when_resources_alongside
          windows_fallback_to_resources_subdir
          windows_exe_parent_takes_priority_over_resources_subdir
          windows_returns_none_when_no_markers
          windows_dev_mode_returns_none
          windows_detects_mcp_os_marker
          windows_detects_build_context_marker
          options_derive_metadata_and_container_uid_from_ssot
          watched_dir_cannot_be_removed_until_watcher_drops
          wipe_data_dir_names_deep_undeletable_path_on_final_failure
          wipe_data_dir_names_failing_path_on_error
          wipe_data_dir_partial_failure_still_removes_deletable_sibling

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Fetch release/* branches
        shell: bash
        run: git fetch origin '+refs/heads/release/*:refs/remotes/origin/release/*'

      - name: Use a short cargo target dir (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          echo 'CARGO_TARGET_DIR=D:\st' >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Cache the short cargo target dir (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: D:\st
          key: ${{ runner.os }}-${{ env.IMAGE_VERSION }}-cargo-desktop-bundle-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.IMAGE_VERSION }}-cargo-desktop-bundle-

      - name: Setup toolchain (Node + Rust + cache)
        uses: ./.github/actions/setup-toolchain
        with:
          rust-targets: ${{ matrix.rust-targets }}
          rust-cache-workspaces: |
            . -> target
            ./desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop/src

      - name: Compute app version
        id: version
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          APP_VERSION="$(cargo run --quiet -p speedwave-version --bin speedwave-version --features cli -- version --branch "$BRANCH")"
          echo "SPEEDWAVE_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Prepare desktop bundle
        uses: ./.github/actions/prepare-desktop-bundle
        with:
          platform: ${{ matrix.platform }}
          args: ${{ matrix.args }}

      - name: Build Tauri app
        working-directory: desktop/src-tauri
        shell: bash
        env:
          CI: true
          MATRIX_ARGS: ${{ matrix.args }}
        run: |
          read -ra ARGS <<< "$MATRIX_ARGS"
          CONFIG="{\"version\":\"$SPEEDWAVE_VERSION\",\"bundle\":{\"createUpdaterArtifacts\":false}}"
          npx --prefix ../src tauri build "${ARGS[@]}" --config "$CONFIG"

      - name: Check an NSIS /UPDATE install removes files the release no longer ships (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/check-nsis-update-reset.ps1 -BundleDir "$env:CARGO_TARGET_DIR\release\bundle\nsis"

      - name: Check the build did not modify a tracked file
        shell: bash
        run: git diff --exit-code

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "No architecture checks defined yet, content is SPEED-750."

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolve the PR's commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "merge_group" ]; then
            echo "base=$MERGE_GROUP_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$MERGE_GROUP_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "base=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
            echo "head=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Install gitleaks
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks

      - name: Secret scan of the PR's commits (a leaked token/key enters a tracked file)
        run: ./gitleaks git --log-opts="${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}" --no-banner

  ci-gate:
    if: always()
    needs:
      - lint
      - test-rust
      - test-rust-windows
      - test-mcp
      - test-desktop
      - test-cli
      - ci-config
      - audit
      - swift
      - desktop-windows-check
      - build
      - architecture
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Every job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: scripts/ci-gate.sh
