name: Tests

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lane-lint.yml

  test-rust:
    uses: ./.github/workflows/lane-test-rust.yml

  test-rust-windows:
    uses: ./.github/workflows/lane-test-rust-windows.yml

  test-mcp:
    uses: ./.github/workflows/lane-test-mcp.yml

  test-desktop:
    uses: ./.github/workflows/lane-test-desktop.yml

  test-cli:
    uses: ./.github/workflows/lane-test-cli.yml

  ci-config:
    uses: ./.github/workflows/lane-ci-config.yml

  audit:
    uses: ./.github/workflows/lane-audit.yml

  swift:
    uses: ./.github/workflows/lane-swift.yml

  desktop-windows-check:
    uses: ./.github/workflows/lane-desktop-windows-check.yml

  build:
    uses: ./.github/workflows/lane-build.yml

  architecture:
    uses: ./.github/workflows/lane-architecture.yml

  security:
    uses: ./.github/workflows/lane-security.yml

  ci-gate:
    if: always()
    needs:
      - lint
      - test-rust
      - test-rust-windows
      - test-mcp
      - test-desktop
      - test-cli
      - ci-config
      - audit
      - swift
      - desktop-windows-check
      - build
      - architecture
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Every job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: scripts/ci-gate.sh
