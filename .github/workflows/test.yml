name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    # macOS runner: `cargo clippy -p speedwave-runtime` instantiates
    # `detect_runtime()`, which compile_error!s on any target_os other than
    # macos/windows after ADR-059. Ubuntu would fire that error before clippy
    # ever runs. macOS-latest is the cheapest runner that satisfies the cfg.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            containers/proxy/target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock', 'containers/proxy/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-servers/package-lock.json

      - name: Install dependencies
        run: |
          cargo fetch
          npm ci --ignore-scripts
          cd mcp-servers && npm ci

      # policies/src/engine.ts imports the wasm-pkg artifact directly, so the `tsc` build below
      # needs it staged first (build-wasm.sh — matches the desktop job's toolchain install).
      - name: Install wasm toolchain (PII engine)
        run: |
          rustup target add wasm32-unknown-unknown
          npm install -g wasm-pack

      - name: Rust clippy
        run: cargo clippy -p speedwave-runtime -p speedwave-cli -- -D warnings

      # containers/proxy is its own Cargo workspace (separate lockfile) — its
      # deny-level [lints.clippy] table needs its own clippy invocation.
      - name: Proxy clippy
        run: make check-proxy-clippy

      # `make check-fmt` covers all three Rust workspaces (root, desktop/src-tauri,
      # containers/proxy) plus Prettier — the same gate pre-push runs.
      - name: Format check
        run: make check-fmt

      - name: MCP type-check (build shared first)
        working-directory: mcp-servers
        run: |
          (cd shared && npx tsc)
          # hub resolves @speedwave/policy-engine types from policies/dist, so build (not noEmit).
          (cd policies && npm run build:wasm)
          (cd policies && npx tsc)
          # `playwright` is a Container-built bridge worker — no TS sources, no tsconfig.
          for ws in policies hub slack sharepoint redmine gitlab os atlassian context7 github oauth office; do
            echo "tsc --noEmit $ws"
            (cd "$ws" && npx tsc --noEmit)
          done

      - name: MCP ESLint
        working-directory: mcp-servers
        run: npx eslint .

  test:
    # macOS runner: see comment on the `lint` job above — speedwave-runtime
    # compile_error!s on Linux per ADR-059.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            containers/proxy/target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock', 'containers/proxy/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-servers/package-lock.json

      - name: Install dependencies
        run: |
          cargo fetch
          npm ci --ignore-scripts
          cd mcp-servers && npm ci

      # cmake is needed to build whisper.cpp (vendored submodule of whisper-rs)
      # for the audio-transcription feature tests below. ADR-056.
      - name: Install cmake
        run: brew install cmake

      # policies/src/engine.ts imports the wasm-pkg artifact; `build-mcp` (coverage-mcp's and
      # test-mcp-os-bundle's prerequisite) runs policies' `build:wasm` script, so it needs this
      # toolchain present (matches the desktop job).
      - name: Install wasm toolchain (PII engine)
        run: |
          rustup target add wasm32-unknown-unknown
          npm install -g wasm-pack

      - name: Rust tests (incl. transcription)
        run: make test-rust

      - name: Proxy tests
        run: make test-proxy

      - name: MCP tests + coverage
        run: make coverage-mcp

      # Unix-only upgrade-path test against the real bundled mcp-os worker;
      # reached locally only via `make test-desktop`, so CI is its sole gate.
      - name: mcp-os bundle upgrade-path test
        run: make test-mcp-os-bundle

      # vitest above mocks the office worker's subprocesses; this is the only
      # gate that actually runs the Python scripts against the real libraries.
      - name: Office Python script tests
        run: make test-mcp-office-py

      - name: Install bats
        run: brew install bats-core

      - name: Entrypoint tests
        run: make test-entrypoint

      - name: CI workflow tests
        run: make test-ci

  desktop:
    # macOS runner: target_os=macos so build.rs/bundle.rs accept the target
    # naturally. Linux runners would need a special-case linux-bundle path
    # purely for CI — see ADR-059.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-desktop-

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/src/package-lock.json

      # This job (not the prepare-desktop-bundle composite action) is what runs
      # bundle-build-context.bats against the real script — `make test-desktop-build` below
      # invokes it ~20 times, each rebuilding the PII engine wasm artifact.
      - name: Install wasm toolchain (PII engine)
        run: |
          rustup target add wasm32-unknown-unknown
          npm install -g wasm-pack

      - name: Install dependencies
        working-directory: desktop/src-tauri
        run: cargo fetch

      - name: Install Angular dependencies
        working-directory: desktop/src
        run: npm ci

      - name: Install mcp-servers dependencies
        # Required by `make test-desktop-build` → `build-mcp` → TypeScript
        # compiler needs @types/node and mcp-servers workspace deps.
        working-directory: mcp-servers
        run: npm ci

      - name: Create resource stubs for Tauri build script
        run: scripts/create-desktop-stubs.sh

      - name: Desktop clippy
        working-directory: desktop/src-tauri
        env:
          SPEEDWAVE_ALLOW_BUNDLE_STUBS: "1"
        run: cargo clippy -- -D warnings

      # Executes the crate's macOS/cross-platform unit tests; the Windows-only
      # ones run in the desktop-windows-check job (cfg-excluded here).
      - name: Desktop tests
        env:
          SPEEDWAVE_ALLOW_BUNDLE_STUBS: "1"
        run: make test-desktop-run

      - name: Angular ESLint
        working-directory: desktop/src
        run: npx eslint 'src/**/*.ts'

      - name: Angular tests + coverage
        working-directory: desktop/src
        # Use `ng test` rather than `npx vitest run` directly: the
        # `@angular/build:unit-test` builder generates the
        # `init-testbed.js` bootstrap chunk that calls
        # `TestBed.initTestEnvironment()` and the jsdom DOM. Calling
        # vitest directly skips that chunk and every spec fails with
        # "Need to call TestBed.initTestEnvironment() first" /
        # "document is not defined".
        # `--runner-config vitest.config.ts` opts in to `retry: 2`,
        # which covers a hoist race in Vitest's `isolate: false` mode
        # forced by the Angular unit-test builder. See vitest.config.ts.
        run: npx ng test --no-watch --coverage --runner-config vitest.config.ts

      - name: Install bats
        run: brew install bats-core

      - name: Desktop config tests (fast)
        run: make test-desktop-config

      - name: Release-gate tests (gh shim)
        run: make test-release-gate

      - name: Desktop bats tests
        # Runs make test-desktop-build which has build-angular + build-mcp
        # as dependencies. desktop-build.bats checks that the Angular
        # frontendDist contains index.html after the build — skipping the
        # build step would defeat the purpose of that assertion.
        run: make test-desktop-build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: .node-version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-audit-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-audit-

      - name: npm audit (mcp-servers)
        run: cd mcp-servers && npm audit --audit-level=high --omit=dev

      - name: npm audit (desktop)
        run: cd desktop/src && npm audit --audit-level=high --omit=dev

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # quick-xml <0.41 DoS advisories: transitive via self_update (CLI self-update
      # only), no fixed self_update release. Keep in sync with Makefile AUDIT_IGNORE.
      - name: cargo audit (root workspace)
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

      - name: cargo audit (desktop)
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 --file desktop/src-tauri/Cargo.lock

  swift:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build native macOS CLI binaries (universal)
        run: scripts/build-native-macos.sh

      - name: Run Swift tests
        run: make test-swift

  # Windows behaviour the macos-latest lint/test jobs can't cover; each step below
  # is scoped because compose/consts fixtures use POSIX paths that fail on Windows.
  runtime-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-runtime-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-runtime-

      - name: cargo test runtime::lima
        run: cargo test -p speedwave-runtime --lib "runtime::lima::"

      - name: cargo test runtime::wsl
        run: cargo test -p speedwave-runtime --lib "runtime::wsl::"

      - name: cargo test runtime build
        shell: bash
        run: cargo test -p speedwave-runtime --lib "build::"

      - name: cargo test host_mcp_process::job_object
        # Windows-only kill-on-close end-to-end — see ADR-048.
        shell: bash
        run: cargo test -p speedwave-runtime --lib "host_mcp_process::job_object"

      - name: cargo test binary
        run: cargo test -p speedwave-runtime --lib "binary::"

      - name: cargo test speedwave-cli
        run: cargo test -p speedwave-cli --bins

      - name: Verify .gitattributes survives core.autocrlf=true checkout
        shell: bash
        env:
          REPO_PATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/recheck"
          rm -rf "$tmp"
          git -c core.autocrlf=true clone "$REPO_PATH" "$tmp"
          cd "$tmp"
          fail=0
          while IFS= read -r -d '' f; do
            if ! tr -d "$(printf '\r')" < "$f" | cmp -s - "$f"; then
              echo "::error file=$f::CRLF detected after autocrlf=true checkout — .gitattributes regression"
              fail=1
            fi
          done < <(find containers -type f -name '*.sh' -print0)
          exit "$fail"

  desktop-windows-check:
    # `desktop` job above runs on macOS-latest. This job runs `cargo check`
    # on windows-latest with stubbed bundle resources so Windows-only compile
    # errors (e.g. cfg-gated imports of types used in cross-platform fn
    # signatures) are caught in PR CI without paying for a full Tauri bundle.
    # The budget covers a cold whisper.cpp + ggml-vulkan shader build (ADR-085).
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      # The runner image carries the Visual Studio version used to build the
      # vendored whisper.cpp (whisper-rs-sys) via CMake. Fold the image version
      # into the cache key so a runner-image bump (e.g. VS 2022 -> VS 2026)
      # never restores a target/ whose CMakeCache.txt names a now-absent
      # generator — which makes cmake-rs abort the build script.
      - name: Capture runner image version
        run: echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
            target/
          key: ${{ runner.os }}-${{ env.IMAGE_VERSION }}-cargo-desktop-check-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.IMAGE_VERSION }}-cargo-desktop-check-

      - name: Install Vulkan SDK
        # The Windows whisper build carries the Vulkan backend (ADR-085); the runtime loader
        # dir goes on PATH so `cargo test --bins` binaries (load-time vulkan-1.dll import)
        # start on a GPU-less runner — no device is a clean CPU fallback, no loader is not.
        shell: pwsh
        run: |
          $out = scripts/install-vulkan-sdk.ps1
          $out | Write-Output
          $root = (($out | Select-String -Pattern '^VULKAN_SDK=').Line) -replace '^VULKAN_SDK=', ''
          "VULKAN_SDK=$root" | Add-Content $env:GITHUB_ENV
          Join-Path $root 'runtime\x64' | Add-Content $env:GITHUB_PATH

      - name: Create resource stubs for Tauri build script
        run: scripts/create-desktop-stubs.sh

      - name: cargo check speedwave-desktop
        working-directory: desktop/src-tauri
        env:
          SPEEDWAVE_ALLOW_BUNDLE_STUBS: "1"
        run: cargo check --all-targets

      # The runtime transcription module carries #[cfg(windows)] tests (audio_windows: WASAPI
      # capture, drop counters) that no other job compiles — the macOS lane's
      # `make test-transcription` skips them by target. The module filter runs every current
      # and future windows-gated test in the module, so there is no name list to drift.
      - name: cargo test speedwave-runtime transcription (windows)
        run: cargo test -p speedwave-runtime --features audio-transcription "transcription::"

      # The crate's `#[cfg(windows)]` tests by name — nowhere else runs them, and
      # a bare `--bins` pulls in cross-platform POSIX-path fixtures that fail here.
      # `_tests/ci/windows-only-test-list.bats` fails CI if a Windows-cfg test
      # is added to the crate without a matching name added here.
      - name: cargo test speedwave-desktop (windows-only)
        working-directory: desktop/src-tauri
        env:
          SPEEDWAVE_ALLOW_BUNDLE_STUBS: "1"
        run: >
          cargo test --bins --
          desktop_log_dir_windows_path_under_local_appdata_logs
          set_os_integration_enabled_rejects_on_windows
          validate_os_integrations_returns_empty_on_windows
          resolve_cli_source_finds_resources_path
          full_cleanup_calls_in_order_on_windows
          calls_compose_down_for_each_project
          empty_projects_is_noop
          failure_does_not_abort_remaining_projects
          cli_session_appearing_during_compose_down_loop_skips_stop_vm
          cli_session_appearing_mid_batch_aborts_remaining_teardown
          windows_nsis_resolves_exe_parent_when_resources_alongside
          windows_fallback_to_resources_subdir
          windows_exe_parent_takes_priority_over_resources_subdir
          windows_returns_none_when_no_markers
          windows_dev_mode_returns_none
          windows_detects_mcp_os_marker
          windows_detects_build_context_marker
          options_derive_metadata_and_container_uid_from_ssot
          watched_dir_cannot_be_removed_until_watcher_drops
          wipe_data_dir_names_deep_undeletable_path_on_final_failure
          wipe_data_dir_names_failing_path_on_error
          wipe_data_dir_partial_failure_still_removes_deletable_sibling

      # installer_hooks tests run on macOS; cargo check above already validates
      # the Windows compile of every target.
