name: Tests

on:
  pull_request:
  merge_group:
  schedule:
    - cron: '41 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/lane-lint.yml

  test-rust-1:
    uses: ./.github/workflows/lane-test-rust.yml

  test-rust-2:
    needs: test-rust-1
    if: ${{ !cancelled() && contains(fromJSON('["cancelled", "abandoned"]'), needs.test-rust-1.result) }}
    uses: ./.github/workflows/lane-test-rust.yml

  test-rust-3:
    needs: test-rust-2
    if: ${{ !cancelled() && contains(fromJSON('["cancelled", "abandoned"]'), needs.test-rust-2.result) }}
    uses: ./.github/workflows/lane-test-rust.yml

  test-linux:
    uses: ./.github/workflows/lane-test-linux.yml

  test-macos-1:
    uses: ./.github/workflows/lane-test-macos.yml

  test-macos-2:
    needs: test-macos-1
    if: ${{ !cancelled() && contains(fromJSON('["cancelled", "abandoned"]'), needs.test-macos-1.result) }}
    uses: ./.github/workflows/lane-test-macos.yml

  test-macos-3:
    needs: test-macos-2
    if: ${{ !cancelled() && contains(fromJSON('["cancelled", "abandoned"]'), needs.test-macos-2.result) }}
    uses: ./.github/workflows/lane-test-macos.yml

  test-windows:
    uses: ./.github/workflows/lane-test-windows.yml

  ci-config:
    uses: ./.github/workflows/lane-ci-config.yml

  audit:
    uses: ./.github/workflows/lane-audit.yml

  build-windows:
    uses: ./.github/workflows/lane-build.yml
    with:
      platform: windows-latest

  build-macos-1:
    uses: ./.github/workflows/lane-build.yml
    with:
      platform: macos-latest

  build-macos-2:
    needs: build-macos-1
    if: ${{ !cancelled() && contains(fromJSON('["cancelled", "abandoned"]'), needs.build-macos-1.result) }}
    uses: ./.github/workflows/lane-build.yml
    with:
      platform: macos-latest

  build-macos-3:
    needs: build-macos-2
    if: ${{ !cancelled() && contains(fromJSON('["cancelled", "abandoned"]'), needs.build-macos-2.result) }}
    uses: ./.github/workflows/lane-build.yml
    with:
      platform: macos-latest

  architecture:
    uses: ./.github/workflows/lane-architecture.yml

  security:
    uses: ./.github/workflows/lane-security.yml

  ci-gate:
    if: always()
    needs:
      - lint
      - test-rust-1
      - test-rust-2
      - test-rust-3
      - test-linux
      - test-macos-1
      - test-macos-2
      - test-macos-3
      - test-windows
      - ci-config
      - audit
      - build-windows
      - build-macos-1
      - build-macos-2
      - build-macos-3
      - architecture
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Every job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: scripts/ci-gate.sh
