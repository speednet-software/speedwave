name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    # macOS runner: `cargo clippy -p speedwave-runtime` instantiates
    # `detect_runtime()`, which compile_error!s on any target_os other than
    # macos/windows after ADR-059. Ubuntu would fire that error before clippy
    # ever runs. macOS-latest is the cheapest runner that satisfies the cfg.
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-servers/package-lock.json

      - name: Install dependencies
        run: |
          cargo fetch
          npm ci --ignore-scripts
          cd mcp-servers && npm ci

      - name: Rust clippy
        run: cargo clippy -p speedwave-runtime -p speedwave-cli -- -D warnings

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Prettier format check
        run: npx prettier --check 'mcp-servers/*/src/**/*.ts' 'desktop/src/src/**/*.ts' '*.md'

      - name: MCP type-check (build shared first)
        working-directory: mcp-servers
        run: |
          (cd shared && npx tsc)
          # `playwright` is a Container-built bridge worker — no TS sources, no tsconfig.
          for ws in hub slack sharepoint redmine gitlab os atlassian context7 github oauth office; do
            echo "tsc --noEmit $ws"
            (cd "$ws" && npx tsc --noEmit)
          done

      - name: MCP ESLint
        working-directory: mcp-servers
        run: npx eslint .

  test:
    # macOS runner: see comment on the `lint` job above — speedwave-runtime
    # compile_error!s on Linux per ADR-059.
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-servers/package-lock.json

      - name: Install dependencies
        run: |
          cargo fetch
          npm ci --ignore-scripts
          cd mcp-servers && npm ci

      # cmake is needed to build whisper.cpp (vendored submodule of whisper-rs)
      # for the audio-transcription feature tests below. ADR-056.
      - name: Install cmake
        run: brew install cmake

      - name: Rust tests
        run: make test-rust

      - name: Transcription tests (audio-transcription feature)
        run: make test-transcription

      - name: MCP tests + coverage
        run: make coverage-mcp

      # vitest above mocks the office worker's subprocesses; this is the only
      # gate that actually runs the Python scripts against the real libraries.
      - name: Office Python script tests
        run: make test-mcp-office-py

      - name: Install bats
        run: brew install bats-core

      - name: Entrypoint tests
        run: make test-entrypoint

  desktop:
    # macOS runner: target_os=macos so build.rs/bundle.rs accept the target
    # naturally. Linux runners would need a special-case linux-bundle path
    # purely for CI — see ADR-059.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: ${{ runner.os }}-cargo-desktop-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-desktop-

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: desktop/src/package-lock.json

      - name: Install dependencies
        working-directory: desktop/src-tauri
        run: cargo fetch

      - name: Install Angular dependencies
        working-directory: desktop/src
        run: npm ci

      - name: Install mcp-servers dependencies
        # Required by `make test-desktop-build` → `build-mcp` → TypeScript
        # compiler needs @types/node and mcp-servers workspace deps.
        working-directory: mcp-servers
        run: npm ci

      - name: Create resource stubs for Tauri build script
        run: scripts/create-desktop-stubs.sh

      - name: Desktop clippy
        working-directory: desktop/src-tauri
        env:
          SPEEDWAVE_ALLOW_BUNDLE_STUBS: "1"
        run: cargo clippy -- -D warnings

      - name: Angular ESLint
        working-directory: desktop/src
        run: npx eslint 'src/**/*.ts'

      - name: Angular tests + coverage
        working-directory: desktop/src
        # Use `ng test` rather than `npx vitest run` directly: the
        # `@angular/build:unit-test` builder generates the
        # `init-testbed.js` bootstrap chunk that calls
        # `TestBed.initTestEnvironment()` and the jsdom DOM. Calling
        # vitest directly skips that chunk and every spec fails with
        # "Need to call TestBed.initTestEnvironment() first" /
        # "document is not defined".
        # `--runner-config vitest.config.ts` opts in to `retry: 2`,
        # which covers a hoist race in Vitest's `isolate: false` mode
        # forced by the Angular unit-test builder. See vitest.config.ts.
        run: npx ng test --no-watch --coverage --runner-config vitest.config.ts

      - name: Install bats
        run: brew install bats-core

      - name: Desktop config tests (fast)
        run: make test-desktop-config

      - name: Release-gate tests (gh shim)
        run: make test-release-gate

      - name: Desktop bats tests
        # Runs make test-desktop-build which has build-angular + build-mcp
        # as dependencies. desktop-build.bats checks that the Angular
        # frontendDist contains index.html after the build — skipping the
        # build step would defeat the purpose of that assertion.
        run: make test-desktop-build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: .node-version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-audit-${{ hashFiles('Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-audit-

      - name: npm audit (mcp-servers)
        run: cd mcp-servers && npm audit --audit-level=high --omit=dev

      - name: npm audit (desktop)
        run: cd desktop/src && npm audit --audit-level=high --omit=dev

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (root workspace)
        run: cargo audit

      - name: cargo audit (desktop)
        run: cargo audit --file desktop/src-tauri/Cargo.lock

  swift:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Build native macOS CLI binaries (universal)
        run: scripts/build-native-macos.sh

      - name: Run Swift tests
        run: make test-swift

  # Runtime exec-transport tests on Windows — locks in the WSL path
  # (`wsl.exe -d distro -- sh -c <quoted>`). Without a Windows runner,
  # `runtime::wsl::container_exec` shell-quoting could regress silently —
  # `lint` and `test` run on `macos-latest` and don't exercise the Windows
  # shell-quoting path. We deliberately restrict the
  # test set to `runtime::lima` and `runtime::wsl` modules: the rest of
  # `speedwave-runtime` (binary resolution, build context, compose
  # rendering, consts) uses `/`-rooted paths in fixtures, which fail on
  # Windows for reasons unrelated to this PR. Git Bash ships on the
  # windows-latest image, so the `bash -nc` shell-roundtrip regression in
  # those modules runs as-is. Lima/SSH shell-quoting is exercised by the
  # macOS `desktop` job above.
  runtime-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-runtime-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-runtime-

      - name: cargo test runtime::lima
        run: cargo test -p speedwave-runtime --lib "runtime::lima::"

      - name: cargo test runtime::wsl
        run: cargo test -p speedwave-runtime --lib "runtime::wsl::"

      - name: cargo test runtime build
        shell: bash
        run: cargo test -p speedwave-runtime --lib "build::"

      - name: cargo test host_mcp_process::job_object
        # Windows-only kill-on-close end-to-end — see ADR-048.
        shell: bash
        run: cargo test -p speedwave-runtime --lib "host_mcp_process::job_object"

      - name: Verify .gitattributes survives core.autocrlf=true checkout
        shell: bash
        env:
          REPO_PATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/recheck"
          rm -rf "$tmp"
          git -c core.autocrlf=true clone "$REPO_PATH" "$tmp"
          cd "$tmp"
          fail=0
          while IFS= read -r -d '' f; do
            if ! tr -d "$(printf '\r')" < "$f" | cmp -s - "$f"; then
              echo "::error file=$f::CRLF detected after autocrlf=true checkout — .gitattributes regression"
              fail=1
            fi
          done < <(find containers -type f -name '*.sh' -print0)
          exit "$fail"

  desktop-windows-check:
    # `desktop` job above runs on macOS-latest. This job runs `cargo check`
    # on windows-latest with stubbed bundle resources so Windows-only compile
    # errors (e.g. cfg-gated imports of types used in cross-platform fn
    # signatures) are caught in PR CI without paying for a full Tauri bundle.
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      # The runner image carries the Visual Studio version used to build the
      # vendored whisper.cpp (whisper-rs-sys) via CMake. Fold the image version
      # into the cache key so a runner-image bump (e.g. VS 2022 -> VS 2026)
      # never restores a target/ whose CMakeCache.txt names a now-absent
      # generator — which makes cmake-rs abort the build script.
      - name: Capture runner image version
        run: echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop/src-tauri/target/
          key: ${{ runner.os }}-${{ env.IMAGE_VERSION }}-cargo-desktop-check-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.IMAGE_VERSION }}-cargo-desktop-check-

      - name: Create resource stubs for Tauri build script
        run: scripts/create-desktop-stubs.sh

      - name: cargo check speedwave-desktop
        working-directory: desktop/src-tauri
        env:
          SPEEDWAVE_ALLOW_BUNDLE_STUBS: "1"
        run: cargo check --all-targets

      # installer_hooks tests run on macOS (cargo check above already
      # validates Windows compile); linking the test bin here clashes
      # with sherpa-onnx/whisper-rs CRT (ADR-061).
