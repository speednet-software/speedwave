name: lane-test-mcp

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup toolchain (Node + Rust + cache)
        uses: ./.github/actions/setup-toolchain
        with:
          node-cache-dependency-path: mcp-servers/package-lock.json

      - name: Install wasm toolchain (PII engine)
        run: |
          rustup target add wasm32-unknown-unknown
          npm install -g wasm-pack

      - name: Install dependencies
        working-directory: mcp-servers
        run: npm ci

      - name: MCP tests + coverage
        run: make coverage-mcp

      - name: Office Python script tests
        run: make test-mcp-office-py
