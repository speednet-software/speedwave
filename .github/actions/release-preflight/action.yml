name: 'Release preflight'
description: 'Node + Rust toolchain, cache and the full audit gate shared by the release promote and hotfix jobs. Caller must checkout the repo first (local composite actions need the repo on disk).'
runs:
  using: 'composite'
  steps:
    - name: Fetch release lines and tags
      shell: bash
      run: |
        set -euo pipefail
        git fetch origin '+refs/heads/release/*:refs/remotes/origin/release/*' --no-tags
        git fetch origin --tags --force

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: .node-version

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

    - name: Rust cache
      uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: speedwave-version

    - name: npm audit (all lockfiles)
      shell: bash
      run: make audit-npm

    - name: pip audit (office worker lock)
      shell: bash
      run: make audit-office

    - name: Install cargo-audit
      shell: bash
      run: cargo install cargo-audit --locked

    - name: Full audit on the release commit (a red audit blocks promote and hotfix alike)
      shell: bash
      run: make audit-rust
