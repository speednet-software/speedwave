name: 'Prepare Desktop Bundle'
description: 'Downloads per-platform runtime assets (Lima/WSL/Node), bundles the build context + native binaries, builds the CLI, and verifies the bundle. Shared by desktop-build.yml and desktop-release.yml.'
inputs:
  platform:
    description: 'Runner platform (e.g. macos-latest, windows-latest)'
    required: true
  args:
    description: 'Tauri/cargo target args for this matrix leg (e.g. "--target aarch64-apple-darwin")'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Download Lima for bundling
      if: contains(inputs.platform, 'macos')
      uses: ./.github/actions/download-lima
      with:
        arch: ${{ contains(inputs.args, 'aarch64') && 'aarch64' || 'x86_64' }}

    - name: Download WSL resources for offline bundling
      if: inputs.platform == 'windows-latest'
      uses: ./.github/actions/download-wsl-resources

    - name: Install Vulkan SDK and runtime loader
      # The Windows whisper build carries the Vulkan backend (ADR-085): the SDK provides
      # headers/vulkan-1.lib/glslc for the build, and the redistributable loader gets bundled
      # next to the exe. The runner is elevated, so the pinned installer runs silently. The
      # version pin lives only in the script; its final VULKAN_SDK=... line feeds later steps.
      if: inputs.platform == 'windows-latest'
      shell: pwsh
      run: |
        $out = scripts/install-vulkan-sdk.ps1
        $out | Write-Output
        ($out | Select-String -Pattern '^VULKAN_SDK=').Line | Add-Content $env:GITHUB_ENV

    - name: Stage Vulkan runtime loader for bundling
      if: inputs.platform == 'windows-latest'
      shell: bash
      run: bash scripts/stage-vulkan-runtime.sh

    - name: Download Node.js for bundling
      uses: ./.github/actions/download-nodejs
      with:
        platform: ${{ contains(inputs.platform, 'macos') && 'darwin' || 'win' }}
        arch: ${{ (contains(inputs.platform, 'macos') && contains(inputs.args, 'aarch64')) && 'arm64' || 'x64' }}

    - name: Install wasm toolchain (PII engine)
      shell: bash
      run: |
        rustup target add wasm32-unknown-unknown
        npm install -g wasm-pack

    - name: Bundle build context and mcp-os
      shell: bash
      run: scripts/bundle-build-context.sh --ci

    - name: Build macOS native CLI binaries
      if: contains(inputs.platform, 'macos')
      shell: bash
      run: scripts/build-native-macos.sh

    - name: Bundle macOS native CLI binaries
      if: contains(inputs.platform, 'macos')
      shell: bash
      run: scripts/bundle-native-assets.sh

    - name: Build CLI for bundling
      shell: bash
      env:
        MATRIX_ARGS: ${{ inputs.args }}
        MATRIX_PLATFORM: ${{ inputs.platform }}
      run: |
        # Extract --target value from matrix.args using sed (BSD-compatible)
        TARGET=$(echo "$MATRIX_ARGS" | sed -n 's/.*--target \([^ ]*\).*/\1/p')
        if [ -n "$TARGET" ]; then
          cargo build --release --target "$TARGET" -p speedwave-cli
          CLI_BIN="target/$TARGET/release/speedwave"
        else
          cargo build --release -p speedwave-cli
          CLI_BIN="target/release/speedwave"
        fi
        # Windows: append .exe
        if [ "$MATRIX_PLATFORM" = "windows-latest" ]; then
          CLI_BIN="${CLI_BIN}.exe"
        fi
        mkdir -p desktop/src-tauri/cli
        cp "$CLI_BIN" desktop/src-tauri/cli/

    - name: Verify bundled runtime assets
      shell: bash
      env:
        MATRIX_PLATFORM: ${{ inputs.platform }}
      run: |
        if [ "$MATRIX_PLATFORM" = "windows-latest" ]; then
          scripts/verify-bundled-assets.sh windows
        else
          scripts/verify-bundled-assets.sh macos
        fi
