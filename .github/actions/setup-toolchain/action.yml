name: 'Setup Toolchain'
description: 'Sets up Node.js (version from .node-version) + Rust stable + swatinem/rust-cache. Shared by desktop-build.yml and desktop-release.yml so the pinned action SHAs live in one place.'
inputs:
  rust-targets:
    description: 'Comma-separated rustup targets to install with the toolchain (empty for none)'
    required: false
    default: ''
  rust-cache-workspaces:
    description: 'swatinem/rust-cache `workspaces` value (newline-separated dir -> cache-dir entries)'
    required: true
  node-cache-dependency-path:
    description: 'setup-node cache-dependency-path (lockfiles that key the npm cache)'
    required: false
    default: 'desktop/src/package-lock.json'
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: ${{ inputs.node-cache-dependency-path }}

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable
      with:
        targets: ${{ inputs.rust-targets }}

    - name: Ensure cross-compile target is installed
      if: inputs.rust-targets != ''
      shell: bash
      env:
        RUST_TARGETS: ${{ inputs.rust-targets }}
      run: |
        # rust-toolchain's `targets` is best-effort; add explicitly so a cache
        # hit that skipped the toolchain install still has the targets.
        IFS=',' read -ra _targets <<< "$RUST_TARGETS"
        for t in "${_targets[@]}"; do
          [ -n "$t" ] && rustup target add "$t"
        done

    - name: Rust cache
      uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
      with:
        workspaces: ${{ inputs.rust-cache-workspaces }}
